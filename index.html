<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#b0241c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>青共校刷题 · 第49期</title>
<style>
:root{
  --bg:#f6f2ea; --card:#fffdf8; --panel:#faf6ee; --ink:#241f1a; --muted:#7d7468;
  --line:#e7dfd0; --brand:#b0241c; --brand-2:#8d1a14; --brand-soft:#fbeae7;
  --gold:#b98b3e; --ok:#2e7d5b; --ok-soft:#e9f5ee; --bad:#c0392b; --bad-soft:#fbeae8;
  --chip:#f0e9dc; --shadow:0 10px 30px rgba(70,45,20,.08); --shadow-sm:0 2px 10px rgba(70,45,20,.06);
  --r:18px;
}
html[data-theme="dark"]{
  --bg:#15120e; --card:#1f1b16; --panel:#262119; --ink:#f3ede2; --muted:#a89d8c;
  --line:#332c23; --brand:#e0604f; --brand-2:#ef7a6a; --brand-soft:#3a201c;
  --gold:#d9b36a; --ok:#5fbf8e; --ok-soft:#1b2e25; --bad:#ef7a6a; --bad-soft:#331e1b;
  --chip:#2c261e; --shadow:0 10px 30px rgba(0,0,0,.35); --shadow-sm:0 2px 10px rgba(0,0,0,.3);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;overflow-x:hidden}
body{overflow-x:hidden}
body{
  margin:0;background:var(--bg);color:var(--ink);min-height:100vh;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
  font-size:15px;line-height:1.6;overscroll-behavior-y:none;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(900px 420px at 8% -8%, rgba(176,36,28,.10), transparent 60%),
    radial-gradient(700px 380px at 100% 0%, rgba(185,139,62,.12), transparent 60%);
}
html[data-theme="dark"] body::before{
  background:
    radial-gradient(900px 420px at 8% -8%, rgba(224,96,79,.12), transparent 60%),
    radial-gradient(700px 380px at 100% 0%, rgba(217,179,106,.08), transparent 60%);
}
button{font:inherit;color:inherit}
a{color:var(--brand)}
#wrap{position:relative;z-index:1;max-width:900px;margin:0 auto;padding:0 16px 108px}
body[data-view="practice"] #wrap{padding-bottom:150px}
body[data-view="practice"] .topbar{display:none}
body[data-view="practice"] .tabbar{display:none}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;
  padding:10px 0 8px;background:linear-gradient(var(--bg) 70%, rgba(0,0,0,0));}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.seal{width:34px;height:34px;flex:0 0 34px;border-radius:10px;display:grid;place-items:center;
  background:linear-gradient(145deg,var(--brand),var(--brand-2));color:#fff;font-weight:700;font-size:17px;
  box-shadow:0 4px 12px rgba(176,36,28,.3);font-family:"Songti SC","SimSun",serif}
.brand b{display:block;font-size:15.5px;letter-spacing:.5px;line-height:1.25}
.brand small{display:block;font-size:11.5px;color:var(--muted);letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ibtn{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--card);
  display:grid;place-items:center;cursor:pointer;color:var(--muted);font-size:17px;transition:.15s}
.ibtn:hover{color:var(--brand);border-color:var(--brand)}

/* ---------- common ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-sm)}
.sec{margin-top:22px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin:0 2px 10px}
.sec-h h2{font-size:15px;margin:0;letter-spacing:.4px;font-weight:650}
.sec-h span{font-size:12px;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);
  background:var(--card);border-radius:12px;padding:10px 16px;cursor:pointer;font-size:14px;font-weight:500;
  transition:.15s;color:var(--ink);text-decoration:none}
.btn:hover{border-color:var(--brand);color:var(--brand)}
.btn.primary{background:linear-gradient(145deg,var(--brand),var(--brand-2));border-color:transparent;color:#fff;
  box-shadow:0 8px 20px rgba(176,36,28,.25);font-weight:600}
.btn.primary:hover{filter:brightness(1.05);color:#fff}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--brand);background:var(--brand-soft)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.block{width:100%}
.chip{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:999px;
  background:var(--chip);color:var(--ink);font-size:12px;border:1px solid transparent}
.chip.brand{background:var(--brand-soft);color:var(--brand)}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:11.5px;
  background:var(--brand-soft);color:var(--brand);font-weight:600;letter-spacing:.3px}
.pill.ghost{background:var(--chip);color:var(--muted);font-weight:500}

/* ---------- home ---------- */
.hero{margin-top:4px;padding:22px 20px 20px;position:relative;overflow:hidden;
  background:linear-gradient(150deg,var(--card) 0%,var(--panel) 60%,var(--brand-soft) 140%);
  border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow)}
.hero::after{content:"";position:absolute;right:-40px;top:-60px;width:200px;height:200px;border-radius:50%;
  border:34px solid rgba(176,36,28,.06)}
.hero .kicker{font-size:11.5px;letter-spacing:2.5px;color:var(--gold);font-weight:700;text-transform:uppercase}
.hero h1{margin:8px 0 6px;font-size:27px;line-height:1.25;letter-spacing:1px;
  font-family:"Songti SC","Noto Serif SC","SimSun",serif;font-weight:700}
.hero p{margin:0;color:var(--muted);font-size:13px}
.hero-row{display:flex;align-items:center;gap:18px;margin-top:16px}
.hero-row .grow{flex:1;min-width:0}
.ring{width:82px;height:82px;flex:0 0 82px;border-radius:50%;position:relative;
  background:conic-gradient(var(--brand) calc(var(--p,0)*1%), var(--line) 0);
  display:grid;place-items:center;transition:.4s}
.ring::before{content:"";position:absolute;inset:7px;border-radius:50%;background:var(--card)}
.ring .in{position:relative;text-align:center;line-height:1.1}
.ring b{display:block;font-size:21px;letter-spacing:-.5px}
.ring span{display:block;font-size:10px;color:var(--muted);margin-top:2px;letter-spacing:.5px}
.hero-row .stat-grid{max-width:330px}
.hero-actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.hero-actions .btn{flex:1;min-width:132px;padding:12px 16px}

.stat-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 6px;text-align:center}
.stat b{display:block;font-size:18px;letter-spacing:-.3px;line-height:1.2}
.stat span{display:block;font-size:11px;color:var(--muted);margin-top:2px}

.type-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.type-card{padding:14px 12px 12px;text-align:left;cursor:pointer;position:relative;overflow:hidden;
  background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-sm);transition:.16s}
.type-card:hover{transform:translateY(-2px);border-color:var(--brand);box-shadow:var(--shadow)}
.type-card .ic{font-size:20px;line-height:1;color:var(--brand)}
.type-card b{display:block;margin-top:8px;font-size:14.5px}
.type-card .n{font-size:11.5px;color:var(--muted);margin-top:1px}
.type-card .bar{height:4px;border-radius:99px;background:var(--chip);margin-top:10px;overflow:hidden}
.type-card .bar i{display:block;height:100%;background:var(--brand);border-radius:99px;transition:.5s}

.tag-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tag-row{display:flex;align-items:center;gap:9px;padding:11px 12px;min-width:0;background:var(--card);
  border:1px solid var(--line);border-radius:13px;cursor:pointer;text-align:left;transition:.15s}
.tag-row:hover{border-color:var(--brand);background:var(--brand-soft)}
.tag-row .t{flex:1;min-width:0}
.tag-row .t b{white-space:normal !important;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tag-row .t b{display:block;font-size:13px;font-weight:600}
.tag-row .t span{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.tag-row .mini{width:34px;height:34px;flex:0 0 34px;border-radius:50%;display:grid;place-items:center;
  font-size:10.5px;font-weight:700;background:conic-gradient(var(--brand) calc(var(--p,0)*1%), var(--chip) 0)}
.tag-row .mini i{width:26px;height:26px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-style:normal}

.quick-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.quick{display:flex;align-items:center;gap:12px;padding:14px;text-align:left;cursor:pointer;
  background:var(--card);border:1px solid var(--line);border-radius:16px;transition:.16s;box-shadow:var(--shadow-sm)}
.quick:hover{border-color:var(--brand);transform:translateY(-1px)}
.quick .qi{width:38px;height:38px;flex:0 0 38px;border-radius:11px;display:grid;place-items:center;
  background:var(--brand-soft);color:var(--brand);font-size:17px}
.quick b{display:block;font-size:13.5px}
.quick span{display:block;font-size:11px;color:var(--muted)}

.resume{display:flex;align-items:center;gap:12px;padding:13px 15px;margin-top:12px;border-radius:14px;
  background:var(--brand-soft);border:1px dashed var(--brand);cursor:pointer}
.resume .grow{flex:1;min-width:0}
.resume b{font-size:13.5px}
.resume span{display:block;font-size:11.5px;color:var(--muted)}

/* ---------- practice ---------- */
.p-head{position:sticky;top:0;z-index:40;background:var(--bg);padding:10px 0 8px}
.p-head .row{display:flex;align-items:center;gap:10px}
.p-head .ttl{flex:1;min-width:0;text-align:center;font-size:13px;color:var(--muted)}
.p-head .ttl b{display:block;color:var(--ink);font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clock{font-variant-numeric:tabular-nums;font-size:13px;font-weight:600;padding:5px 10px;border-radius:9px;
  background:var(--chip);color:var(--ink);min-width:56px;text-align:center}
.clock.hot{background:var(--bad-soft);color:var(--bad)}
.pbar{height:5px;border-radius:99px;background:var(--chip);overflow:hidden;margin:8px 0 2px}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--gold));border-radius:99px;transition:.35s}

.qcard{padding:18px 18px 20px;border-radius:20px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow-sm)}
.qmeta{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:12px}
.qmeta .qnum{margin-left:auto;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.stem{font-size:16.5px;line-height:1.9;letter-spacing:.2px}
.blank{display:inline-block;min-width:4.2em;border-bottom:1.6px dashed var(--brand);margin:0 .15em;height:1.05em;vertical-align:-.12em}
.material{margin:12px 0 0;padding:11px 13px;background:var(--panel);border-radius:12px;font-size:14px;line-height:1.95;color:var(--ink)}
.material div{display:flex;gap:6px;align-items:flex-start}
.opts{display:flex;flex-direction:column;gap:9px;margin-top:16px}
.opt{display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;padding:12px 14px;
  border:1.5px solid var(--line);background:var(--card);border-radius:13px;cursor:pointer;transition:.14s;font-size:14.5px;line-height:1.7}
.opt:hover:not(.disabled){border-color:var(--brand);background:var(--brand-soft)}
.opt .k{width:26px;height:26px;flex:0 0 26px;border-radius:50%;display:grid;place-items:center;
  background:var(--chip);font-weight:700;font-size:12.5px;margin-top:1px;transition:.14s}
.opt .v{flex:1;min-width:0}
.opt.sel{border-color:var(--brand);background:var(--brand-soft)}
.opt.sel .k{background:var(--brand);color:#fff}
.opt.correct{border-color:var(--ok);background:var(--ok-soft)}
.opt.correct .k{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad);color:#fff}
.opt.disabled{cursor:default}
.opt .mark{margin-left:auto;font-size:12px;font-weight:600;align-self:center}

.fb{margin-top:16px;border-radius:14px;padding:14px 15px;border:1px solid var(--line);background:var(--panel);animation:pop .18s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.fb.ok{background:var(--ok-soft);border-color:transparent}
.fb.bad{background:var(--bad-soft);border-color:transparent}
.fb-t{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px}
.fb.ok .fb-t{color:var(--ok)}
.fb.bad .fb-t{color:var(--bad)}
.fb-t .ans{margin-left:auto;font-size:12.5px;font-weight:600;color:var(--muted);letter-spacing:.5px}
.fb-x{margin-top:8px;font-size:14px;line-height:1.8;color:var(--ink)}
.fb-x b{color:var(--brand)}
.ans-block{margin-top:10px;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:12px;
  font-size:14px;line-height:1.85;white-space:pre-wrap}
.ans-block .lbl{display:inline-block;font-size:11px;color:var(--muted);letter-spacing:1px;margin-bottom:4px}
.kw{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.kw span{font-size:12px;padding:3px 8px;border-radius:7px;background:var(--ok-soft);color:var(--ok)}
.kw span.miss{background:var(--bad-soft);color:var(--bad)}
.score-line{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:13px;color:var(--muted)}
.score-line .bar{flex:1;height:7px;border-radius:99px;background:var(--chip);overflow:hidden}
.score-line .bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--brand),var(--gold))}
textarea.ta{width:100%;min-height:96px;margin-top:14px;padding:12px 14px;border-radius:13px;border:1.5px solid var(--line);
  background:var(--panel);color:var(--ink);font:inherit;font-size:14.5px;line-height:1.8;resize:vertical}
textarea.ta:focus{outline:none;border-color:var(--brand)}
.self-grade{display:flex;gap:8px;margin-top:10px}
.self-grade .btn{flex:1;padding:10px 6px;font-size:13px}
.p-foot{position:fixed;left:0;right:0;bottom:0;z-index:45;background:var(--bg);
  border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.p-foot .inner{max-width:868px;margin:0 auto;display:flex;gap:9px;align-items:center}
.p-foot .btn{flex:1;padding:12px 8px}
.p-foot .fav{flex:0 0 48px;font-size:19px;padding:10px 0}
.p-foot .fav.on{color:var(--gold);border-color:var(--gold);background:var(--panel)}

.summary{text-align:center;padding:30px 20px 24px}
.summary .big{font-size:46px;font-weight:800;line-height:1;letter-spacing:-2px;font-variant-numeric:tabular-nums}
.summary .big small{font-size:16px;font-weight:600;color:var(--muted);letter-spacing:0}
.summary h2{margin:12px 0 4px;font-size:20px}
.summary p{margin:0;color:var(--muted);font-size:13px}
.sum-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:22px}
.sum-grid div{background:var(--panel);border-radius:12px;padding:10px 6px}
.sum-grid b{display:block;font-size:17px}
.sum-grid span{font-size:11px;color:var(--muted)}
.sum-actions{display:flex;gap:9px;margin-top:20px;flex-wrap:wrap}
.sum-actions .btn{flex:1;min-width:120px}

/* ---------- lookup ---------- */
.toolbar{position:sticky;top:56px;z-index:30;padding:8px 0 10px;background:var(--bg)}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);
  border-radius:13px;padding:10px 13px}
.search input{flex:1;border:0;background:transparent;color:var(--ink);font:inherit;font-size:14px;outline:none;min-width:0}
.search .ic{color:var(--muted);font-size:15px}
.seg{display:flex;gap:6px;margin-top:9px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.seg::-webkit-scrollbar{display:none}
.seg button{white-space:nowrap;padding:6px 12px;border-radius:999px;border:1px solid var(--line);
  background:var(--card);font-size:12.5px;cursor:pointer;color:var(--muted);transition:.15s}
.seg button.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.lk-meta{display:flex;justify-content:space-between;align-items:center;margin:10px 2px 8px;font-size:12px;color:var(--muted)}
.keysec{margin-top:4px;padding:4px 2px 8px}
.keysec h4{margin:12px 2px 8px;font-size:12.5px;font-weight:650;color:var(--muted);letter-spacing:.5px}
.keygrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.keycell{display:flex;align-items:center;justify-content:space-between;gap:4px;padding:7px 9px;
  border:1px solid var(--line);border-radius:9px;background:var(--card);font-size:11.5px;cursor:pointer;transition:.14s}
.keycell:hover{border-color:var(--brand);background:var(--brand-soft)}
.keycell b{font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums}
.keycell span{font-weight:700;color:var(--brand);letter-spacing:.5px}
.keycell.wide span{font-size:10px;letter-spacing:0}
.lk-list{display:flex;flex-direction:column;gap:8px}
details.qa{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
details.qa[open]{border-color:var(--brand)}
details.qa summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;gap:10px;align-items:flex-start}
details.qa summary::-webkit-details-marker{display:none}
.qa .no{flex:0 0 auto;font-size:11px;font-weight:700;color:var(--muted);padding:2px 6px;border-radius:6px;background:var(--chip);margin-top:2px;font-variant-numeric:tabular-nums}
.qa .q{flex:1;min-width:0;font-size:13.5px;line-height:1.65;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.qa .a{flex:0 0 auto;font-weight:800;font-size:13px;color:var(--brand);background:var(--brand-soft);
  padding:3px 8px;border-radius:8px;letter-spacing:.5px;margin-top:1px}
.qa .a.short{font-weight:600;font-size:11px}
.qa .body{padding:0 14px 14px;border-top:1px dashed var(--line);margin-top:2px;padding-top:12px}
.qa .opts2{display:flex;flex-direction:column;gap:6px;font-size:13.5px;line-height:1.7}
.qa .opts2 div{padding:5px 9px;border-radius:8px;background:var(--panel);display:flex;gap:7px}
.qa .opts2 div.ok{background:var(--ok-soft);color:var(--ok);font-weight:600}
.qa .exp{margin-top:10px;font-size:13px;line-height:1.8;color:var(--muted);white-space:pre-wrap}
.qa .acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.qa .acts .btn{padding:6px 12px;font-size:12px;border-radius:9px}

/* ---------- me ---------- */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 6px;text-align:center}
.tile b{display:block;font-size:18px}
.tile span{font-size:11px;color:var(--muted)}
.tb-row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line)}
.tb-row:last-child{border-bottom:0}
.tb-row .grow{flex:1;min-width:0}
.tb-row b{display:block;font-size:13.5px;font-weight:600}
.tb-row span{display:block;font-size:11.5px;color:var(--muted)}
.switch{width:46px;height:27px;border-radius:99px;background:var(--chip);border:0;position:relative;cursor:pointer;transition:.2s;flex:0 0 46px}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;
  box-shadow:0 1px 4px rgba(0,0,0,.25);transition:.2s}
.switch.on{background:var(--brand)}
.switch.on::after{transform:translateX(19px)}
.bars{display:flex;flex-direction:column;gap:11px;padding:14px}
.bar-row .l{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:5px}
.bar-row .l span{color:var(--muted)}
.bar-row .bar{height:7px;border-radius:99px;background:var(--chip);overflow:hidden}

  )根本任务，培养德智体美劳全面发展的社会主义建设者和接班人。","material":[],"options":[{"k":"A","v":"立德；立德树人"},{"k":"B","v":"立德；立德育人"},{"k":"C","v":"文化教育；立德树人"},{"k":"D","v":"文化教育；立德育人"}],"answer":"A","explanation":"育人的根本在于立德。全面贯彻党的教育方针，落实立德树人根本任务，培养德智体美劳全面发展的社会主义建设者和接班人。"},{"id":"s6","type":"single","num":6,"tag":"党的二十大精神","stem":"党的二十大报告指出，坚持(    )在我国现代化建设全局中的核心地位。","material":[],"options":[{"k":"A","v":"科技进步"},{"k":"B","v":"经济发展"},{"k":"C","v":"创新"},{"k":"D","v":"发展"}],"answer":"C","explanation":"坚持创新在我国现代化建设全局中的核心地位。"},{"id":"s7","type":"single","num":7,"tag":"党的二十大精神","stem":"党的二十大报告指出，我们党立志于中华民族千秋伟业，致力于人类和平与发展崇高事业，责任无比重大，使命无上光荣。全党同志务必(  )，务必(  )，务必(  )，坚定历史自信，增强历史主动，谱写新时代中国特色社会主义更加绚丽的华章。","material":["①不忘初心、牢记使命","②谦虚谨慎、艰苦奋斗","③勤劳勇敢、自强不息","④敢于斗争、善于斗争"],"options":[{"k":"A","v":"①②③"},{"k":"B","v":"①②④"},{"k":"C","v":"①③④"},{"k":"D","v":"②③④"}],"answer":"B","explanation":"我们党立志于中华民族千秋伟业，致力于人类和平与发展崇高事业，责任无比重大，使命无上光荣。全党同志务必不忘初心、牢记使命，务必谦虚谨慎、艰苦奋斗，务必敢于斗争、善于斗争，坚定历史自信，增强历史主动，谱写新时代中国特色社会主义更加绚丽的华章。"},{"id":"s8","type":"single","num":8,"tag":"青年工作","stem":"习近平强调，“青年兴则国家兴，青年强则国家强。青年一代（ ），国家就有前途，民族就有希望。”。","material":[],"options":[{"k":"A","v":"有信念、有本事、有品德"},{"k":"B","v":"有灵魂、有本领、有作为"},{"k":"C","v":"有理想、有本领、有担当"},{"k":"D","v":"有信仰、有作为、有奉献"}],"answer":"C","explanation":"正确答案是 C 选项 “有理想、有本领、有担当”。习近平总书记多次强调青年对国家和民族的重要性，其中明确指出 “青年一代有理想、有本领、有担当，国家就有前途，民族就有希望”，这一论述精准概括了新时代对青年的核心要求，是官方权威表述，与题干内容完全匹配。其他选项中，A 选项 “有信念、有本事、有品德”、B 选项 “有灵魂、有本领、有作为”、D 选项 “有信仰、有作为、有奉献” 均非该重要论述的标准表述，存在关键词差异，因此 A、B、D 均为错误选项。"},{"id":"s9","type":"single","num":9,"tag":"党的二十大精神","stem":"习近平总书记在党的二十大报告指出，拥有（    ）指导是我们党坚定信仰信念、把握历史主动的根本所在。","material":[],"options":[{"k":"A","v":"马克思主义科学理论"},{"k":"B","v":"马克思主义基本原理"},{"k":"C","v":"科学社会主义"},{"k":"D","v":"辩证唯物主义"}],"answer":"A","explanation":"习近平总书记在党的二十大报告中指出：“拥有马克思主义科学理论指导是我们党坚定信仰信念、把握历史主动的根本所在。”这是对我们党百年来思想建党、理论强党历史经验的深刻总结，也对继续推进实践基础上的理论创新、不断开辟马克思主义中国化时代化新境界提出了更高要求。"},{"id":"s10","type":"single","num":10,"tag":"党的二十大精神","stem":"习近平总书记在党的二十大报告中指出，坚持党对人民军队的绝对领导，坚持（    ）。","material":["①政治建军","②改革强军","③科技强军","④人才强军","⑤依法治军"],"options":[{"k":"A","v":"①②③④"},{"k":"B","v":"②③④⑤"},{"k":"C","v":"①②③④⑤"},{"k":"D","v":"①②④⑤"}],"answer":"C","explanation":"习近平指出，如期实现建军一百年奋斗目标，加快把人民军队建成世界一流军队，是全面建设社会主义现代化国家的战略要求。必须贯彻新时代党的强军思想，贯彻新时代军事战略方针，坚持党对人民军队的绝对领导，坚持政治建军、改革强军、科技强军、人才强军、依法治军，加快军事理论现代化、军队组织形态现代化、军事人员现代化、武器装备现代化，提高捍卫国家主权、安全、发展利益战略能力，有效履行新时代人民军队使命任务。"},{"id":"s11","type":"single","num":11,"tag":"习近平新时代中国特色社会主义思想","stem":"习近平总书记在党的二十大报告中指出，中国式现代化的本质要求是：实现（    ）发展。","material":[],"options":[{"k":"A","v":"高水平"},{"k":"B","v":"高速"},{"k":"C","v":"高效"},{"k":"D","v":"高质量"}],"answer":"D","explanation":"习近平总书记在党的二十大报告中指出，“中国式现代化的本质要求是：坚持中国共产党领导，坚持中国特色社会主义，实现高质量发展，发展全过程人民民主，丰富人民精神世界，实现全体人民共同富裕，促进人与自然和谐共生，推动构建人类命运共同体，创造人类文明新形态。”"},{"id":"s12","type":"single","num":12,"tag":"党史国史","stem":"毛泽东同志在《论持久战》中指出：“每个月打一个较大的胜仗，振起我军的士气，号召世界的声援”上述描述的是（    ）战役。","material":[],"options":[{"k":"A","v":"平津战役"},{"k":"B","v":"淮海战役"},{"k":"C","v":"辽沈战役"},{"k":"D","v":"台儿庄战役"}],"answer":"D","explanation":"毛泽东通知在《论持久战》中指出：“每个月打一个较大的胜仗，振起我军的士气，号召世界的声援”上述描述的是台儿庄战役。"},{"id":"s13","type":"single","num":13,"tag":"党史国史","stem":"《共产党宣言》第一个中文全译本的译者是（    ）。","material":[],"options":[{"k":"A","v":"李大钊"},{"k":"B","v":"陈独秀"},{"k":"C","v":"陈望道"},{"k":"D","v":"蔡和森"}],"answer":"C","explanation":"1919年冬，受中国共产党创始人之一的陈独秀委托，陈望道翻译了《共产党宣言》的第一个中文全译本。《共产党宣言》第一个中文全译本的译者是陈望道。"},{"id":"s14","type":"single","num":14,"tag":"党史国史","stem":"1954年9月第一届全国人民代表大会举行第一次会议，通过了（    ）。","material":[],"options":[{"k":"A","v":"《中国人民政治协商会议组织法》"},{"k":"B","v":"《中华人民共和国宪法》"},{"k":"C","v":"《中国人民政治协商会议章程》"},{"k":"D","v":"《中华人民共和国中央人民政府组织法》"}],"answer":"B","explanation":"1954年9月第一届全国人民代表大会举行第一次会议，通过了《中华人民共和国宪法》。"},{"id":"s15","type":"single","num":15,"tag":"党史国史","stem":"1982年9月，邓小平在党的十二大开幕词中明确提出，把马克思主义的普遍真理同我国的具体实际结合起来，走自己的道路，（    ）。","material":[],"options":[{"k":"A","v":"实现中华民族伟大复兴"},{"k":"B","v":"建设富强民主文明的社会主义国家"},{"k":"C","v":"建设有中国特色的社会主义"},{"k":"D","v":"建设四个现代化"}],"answer":"C","explanation":"1982年9月，邓小平在党的十二大开幕词中明确提出：“把马克思主义的普遍真理同我国的具体实际结合起来，走自己的道路，建设有中国特色的社会主义。”这一重大宣示，为正在思考“中国向何处去”的中国共产党人指出了一条光明大道。中国特色社会主义成为指引新时期改革开放和社会主义现代化建设的伟大旗帜。"},{"id":"s16","type":"single","num":16,"tag":"党史国史","stem":"1956年4月25日，毛泽东在中央政治局扩大会议上作了（    ）的讲话，为探索适合中国国情的社会主义建设道路提出了许多重要的思想原则，从思想上、理论上为八大的召开作了重要的准备。","material":[],"options":[{"k":"A","v":"《论十大关系》"},{"k":"B","v":"《关于正确处理人民内部矛盾的问题》"},{"k":"C","v":"《人的正确思想是从哪里来的》"},{"k":"D","v":"《新民主主义论》"}],"answer":"A","explanation":"1955年底至1956年春，为准备召开党的八大和迎接大规模经济建设，毛泽东、刘少奇等中共中央领导人进行了一系列的调研工作。1956年4月25日，根据前一阶段的调查研究并结合苏联社会主义建设的经验教训，毛泽东在中央政治局扩大会议上作了《论十大关系》的报告，5月2日又向最高国务会议系统阐述了十大关系问题。这个报告论述的十个问题，是在总结我国经济建设的经验和以苏联经验为鉴戒的基础上提出来的。《论十大关系》提出后，八大政治报告的起草工作就确定以这个报告的精神为指导思想。"},{"id":"s17","type":"single","num":17,"tag":"党史国史","stem":"20世纪中国人民在前进道路上经历的第一次历史性巨大变化是（    ）。","material":[],"options":[{"k":"A","v":"新文化运动"},{"k":"B","v":"五四运动"},{"k":"C","v":"辛亥革命"},{"k":"D","v":"洋务运动"}],"answer":"C","explanation":"20世纪中国人民在前进道路上经历的第一次历史性巨大变化是辛亥革命。"},{"id":"s18","type":"single","num":18,"tag":"时政热点","stem":"下列说法正确的是(    )。","material":[],"options":[{"k":"A","v":"全国两会每四年称为一届"},{"k":"B","v":"全国人民代表大会提出的是提案"},{"k":"C","v":"全国政协委员提出的是议案"},{"k":"D","v":"我国一共设有五级人民代表大会"}],"answer":"D","explanation":"全国两会每五年称为一届。全国人民代表大会提出的是议案。全国政协委员提出的是提案。我国一共设有五级人民代表大会，分别是全国人民代表大会；省（直辖市）人民代表大会；市（辖区市）人民代表大会；县（市、区）人民代表大会；乡（镇）人民代表大会。"},{"id":"s19","type":"single","num":19,"tag":"党史国史","stem":"（    ）是在中国大地上举起十月社会主义革命旗帜的第一人。","material":[],"options":[{"k":"A","v":"胡适"},{"k":"B","v":"陈独秀"},{"k":"C","v":"李大钊"},{"k":"D","v":"毛泽东"}],"answer":"C","explanation":"李大钊同志是中国最早的马克思主义传播者。1917年俄国十月革命胜利后，李大钊同志备受鼓舞，连续发表《法俄革命之比较观》、《庶民的胜利》、《布尔什维主义的胜利》等文章和演讲，热情讴歌十月革命.他敏锐认识到这场革命将对20世纪世界历史进程产生划时代的影响，从中看到民族独立和人民解放的希望，满怀信心地预言：“试看将来的环球，必是赤旗的世界!"},{"id":"s20","type":"single","num":20,"tag":"党史国史","stem":"标志着中国共产党在政治上开始走向成熟的会议是哪次会议？（    ）","material":[],"options":[{"k":"A","v":"通道会议"},{"k":"B","v":"遵义会议"},{"k":"C","v":"黎平会议"},{"k":"D","v":"猴场会议"}],"answer":"B","explanation":"遵义会议是中国共产党第一次独立自主地运用马克思列宁主义基本原理解决自己的路线、方针和政策方面问题的会议。这次会议，在极端危急的历史关头，挽救了党，挽救了红军，挽救了中国革命，在中国共产党和红军的历史上，是一个生死攸关的转折点。"},{"id":"s21","type":"single","num":21,"tag":"党史国史","stem":"解放战争时期中国共产党领导的第一次大规模的学生爱国民主运动是哪一次？（    ）","material":[],"options":[{"k":"A","v":"一二九运动"},{"k":"B","v":"五二三运动"},{"k":"C","v":"一二一运动"},{"k":"D","v":"三一二运动"}],"answer":"C","explanation":"解放战争时期中国共产党领导的第一次大规模的学生爱国民主运动是一二一运动。"},{"id":"s22","type":"single","num":22,"tag":"习近平新时代中国特色社会主义思想","stem":"党强调意识形态工作是为国家立心、为民族立魂的工作，（    ）是更基础、更广泛、更深厚的自信，是一个国家、一个民族发展中最基本、最深沉、最持久的力量。","material":[],"options":[{"k":"A","v":"道路自信"},{"k":"B","v":"理论自信"},{"k":"C","v":"文化自信"},{"k":"D","v":"制度自信"}],"answer":"C","explanation":"习近平总书记在党的十九大报告中指出：“文化是一个国家、一个民族的灵魂。文化兴国运兴，文化强民族强。没有高度的文化自信，没有文化的繁荣兴盛，就没有中华民族伟大复兴。”十九大报告指出，文化自信是一个国家、一个民族发展中更基本、更深沉、更持久的力量。文化作为一个国家、民族的精神基因，是国家、民族发展的不竭动力与源泉。"},{"id":"s23","type":"single","num":23,"tag":"习近平新时代中国特色社会主义思想","stem":"中国共产党人的初心和使命，就是为中国人民（    ），为中华民族（    ）。这个初心和使命是激励中国共产党人不断前进的根本动力。","material":[],"options":[{"k":"A","v":"谋幸福，谋未来"},{"k":"B","v":"谋生活，谋复兴"},{"k":"C","v":"谋幸福，谋复兴"},{"k":"D","v":"谋生活，谋未来"}],"answer":"C","explanation":"习近平总书记在作十九大报告时说，中国共产党人的初心和使命，就是为中国人民谋幸福，为中华民族谋复兴。"},{"id":"s24","type":"single","num":24,"tag":"党章党规党纪","stem":"中国特色社会主义进入新时代，党的建设的根本方针是（    ）。","material":[],"options":[{"k":"A","v":"全面加强党的执政本领"},{"k":"B","v":"坚持党要管党、从严治党"},{"k":"C","v":"坚持解放思想、改革创新"},{"k":"D","v":"全面推进党的政治建设"}],"answer":"B","explanation":"治国必先治党，治党务必从严。坚持党要管党、从严治党，是党的建设的一贯要求和根本方针。党的十八大以来，以习近平同志为总书记的党中央从坚持和发展中国特色社会主义全局出发，适应全面推进党的建设新的伟大工程的客观需要，明确提出了“全面从严治党”的战略任务并将其纳入了“四个全面”战略布局。"},{"id":"s25","type":"single","num":25,"tag":"人文常识","stem":"下列那句话(    )常用来比喻一旦环境改变，事物的性质也可能随之改变。","material":[],"options":[{"k":"A","v":"橘生淮南则为橘，生于淮北则为枳"},{"k":"B","v":"山积而高，泽积而长"},{"k":"C","v":"万物并育而不相害，道并行而不相悖"},{"k":"D","v":"浩渺行无极，扬帆但信风"}],"answer":"A","explanation":"“橘生淮南则为橘，生于淮北则为枳”，意思是：橘子树生长在淮河以南的地方就是橘子树，生长在淮河以北的地方就是枳树，这句话现在常用来比喻一旦环境改变，事物的性质也可能随之改变，同一物种因环境条件不同而发生变异。“山积而高，泽积而长”源于唐代诗人刘禹锡所撰《唐故监察御史赠尚书右仆射王公神道碑》，土石日积月累形成了不断高耸的山，点滴积聚汇集形成了长流不断的水。“万物并育而不相害，道并行而不相悖”是一个汉语词语，意思是就像天地那样没有不能掌控承载的，没有不被包括施惠的，就像四季交错运行，日月照亮天空。“浩渺行无极，扬帆但信风”的意思是：广阔无垠的大海没有尽头，扬起风帆向着目的地御风而行。出自《送朴山人归新罗》，是唐朝末年湖北荆门僧尚颜所写的一首五言律诗。"},{"id":"s26","type":"single","num":26,"tag":"党史国史","stem":"1924年至1927年，一场以推翻帝国主义在华势力和北洋军阀为目标的革命运动，似滚滚洪流席卷中国大地。人们通常把它称为“大革命”或“国民革命”。1927年大革命失败后，中国共产党确定了（    ）的总方针。","material":[],"options":[{"k":"A","v":"开展工人运动"},{"k":"B","v":"城市暴动和武装斗争"},{"k":"C","v":"争取中间力量和通过合法斗争夺权"},{"k":"D","v":"土地革命和武装斗争"}],"answer":"D","explanation":"八七会议是大革命失败以后，在关系党和革命事业前途和命运的严重危机时刻，中共中央于1927年8月7日在湖北汉口召开的紧急会议。会议批判和纠正了陈独秀右倾机会主义错误，撤销了他在党内的职务，选出了新的临时中央政治局，确定了土地革命和武装斗争的总方针。毛泽东出席了这次会议，并提出了著名的“枪杆子里出政权”的论断。八七会议后，中共中央决定派毛泽东以中共中央特派员的身份前往长沙，领导湘赣边界的秋收起义。会议通过了《中国共产党中央执行委员会告全党党员书》等议案。八七会议在中国革命紧急关头及时地向党和全国人民指明了斗争方向，反对政治上的右倾机会主义，使党在革命中前进了一大步。"},{"id":"s27","type":"single","num":27,"tag":"党史国史","stem":"毛泽东思想的活的灵魂，是贯穿于毛泽东思想各个组成部分的立场、观点和方法，它们有三个基本方面，即实事求是，（    ），独立自主。","material":[],"options":[{"k":"A","v":"一切从实际出发"},{"k":"B","v":"理论联系实际"},{"k":"C","v":"群众路线"},{"k":"D","v":"调查研究"}],"answer":"C","explanation":"2013年12月26日，中共中央在北京人民大会堂举行纪念毛泽东同志诞辰120周年座谈会。习近平总书记在座谈会上全面科学地评价了毛泽东同志和毛泽东思想的历史功绩和历史地位，系统论述了毛泽东思想活的灵魂的基本内涵和时代要求，强调必须始终坚持马克思主义的立场观点方法，坚持全面正确的历史观，坚持实事求是、群众路线、独立自主，毫不动摇走党和人民在长期实践探索中开辟出来的正确道路，把中国特色社会主义伟大事业继续推向前进。毛泽东思想活的灵魂是贯穿其中的立场、观点、方法，它们有三个基本方面，这就是实事求是、群众路线、独立自主。"},{"id":"s28","type":"single","num":28,"tag":"党章党规党纪","stem":"中国共产党成立后的第一个党章是（    ）通过的，它对党员条件、党的各级组织的建设和党的纪律作了具体规定。","material":[],"options":[{"k":"A","v":"中共一大"},{"k":"B","v":"中共二大"},{"k":"C","v":"中共三大"},{"k":"D","v":"中共四大"}],"answer":"B","explanation":"正确答案是 B 选项中共二大。中国共产党成立后的第一个党章是 1922 年中共二大通过的《中国共产党章程》，该党章首次对党员条件、党的各级组织建设以及党的纪律作出了具体且系统的规定，标志着党的建设开始走向制度化、规范化。其他选项中，中共一大虽在 1921 年宣告党成立，但仅通过了具有纲领性质的《中国共产党第一个纲领》，并未制定专门党章；中共三大主要讨论国共合作问题，中共四大重点研究工人阶级在民主革命中的领导权和工农联盟问题，二者均未制定或修订党章，因此 A、C、D 均为错误选项。"},{"id":"s29","type":"single","num":29,"tag":"团史团务","stem":"中国社会主义青年团第一次全国代表大会于（    ）在广州召开，5月10日闭幕。大会的重要成果表明，她是中国青年运动的伟大里程碑。","material":[],"options":[{"k":"A","v":"1922年5月5日"},{"k":"B","v":"1922年5月8日"},{"k":"C","v":"1923年5月5日"},{"k":"D","v":"1923年5月8日"}],"answer":"A","explanation":"中国社会主义青年团第一次全国代表大会1922年5月5日至10日在广州召开。出席大会的代表25人，代表15个地方团组织、5000多名团员。"},{"id":"s30","type":"single","num":30,"tag":"团史团务","stem":"习近平总书记在庆祝中国共产主义青年团成立100周年大会上的讲话指出：百年征程，塑造了共青团（ ）的立身之本、（ ）的政治之魂、（ ）的奋进之力和（ ）的活力之源。","material":[],"options":[{"k":"A","v":"扎根广大青年；坚持党的领导；坚守理想信念；投身民族复兴"},{"k":"B","v":"坚持党的领导；投身民族复兴；扎根广大青年；坚守理想信念"},{"k":"C","v":"扎根广大青年；投身民族复兴；坚守理想信念；坚持党的领导"},{"k":"D","v":"坚持党的领导；坚守理想信念；投身民族复兴；扎根广大青年"}],"answer":"D","explanation":"习近平总书记在庆祝中国共产主义青年团成立100周年大会上的讲话指出，百年征程，塑造了共青团坚持党的领导的立身之本，没有中国共产党，就没有中国共青团。坚守理想信念是共青团的政治之魂，团的一大就明确提出了建设共产主义社会的远大理想。投身民族复兴是共青团的奋进之力，党的奋斗主题就是团的行动方向。扎根广大青年是共青团的活力之源，共青团历经百年沧桑而青春焕发，依靠的就是始终扎根广大青年。"},{"id":"s31","type":"single","num":31,"tag":"青年工作","stem":"中国青年运动的时代主题是（    ）。","material":[],"options":[{"k":"A","v":"用社会主义核心价值体系引导青年"},{"k":"B","v":"为实现中华民族伟大复兴的中国梦而奋斗"},{"k":"C","v":"竭诚帮助服务青年成长发展"},{"k":"D","v":"在全面建成小康社会进程中充分发挥生力军作用"}],"answer":"B","explanation":"实现中华民族伟大复兴的中国梦，是党和国家工作大局，也是中国青年运动的时代主题。同人民一道拼搏、同祖国一道前进，服务人民、奉献祖国是当代中国青年的正确方向。"},{"id":"s32","type":"single","num":32,"tag":"青年工作","stem":"青联授予青年的最高荣誉称号是（    ）。","material":[],"options":[{"k":"A","v":"中国青年五四奖章"},{"k":"B","v":"优秀团千部"},{"k":"C","v":"全国优秀共青团员"},{"k":"D","v":"优秀青年"}],"answer":"A","explanation":"“中国青年五四奖章”是共青团中央、全国青联授予中国优秀青年的最高荣誉。旨在树立政治进步、品德高尚、贡献突出的优秀青年典型，集中反映当代青年的精神品格和价值追求。"},{"id":"s33","type":"single","num":33,"tag":"团史团务","stem":"中国共产主义青年团团歌是在团的（    ）上确定。","material":[],"options":[{"k":"A","v":"一大"},{"k":"B","v":"十三大"},{"k":"C","v":"十四大"},{"k":"D","v":"十五大"}],"answer":"D","explanation":"中国共产主义青年团团歌是在团的十五大上确定。"},{"id":"s34","type":"single","num":34,"tag":"团史团务","stem":"中国社会主义青年团第一次全国代表大会通过了我国第一部团的章程是（    ）。","material":[],"options":[{"k":"A","v":"《中国社会主义青年团临时章程》"},{"k":"B","v":"《中国共产主义临时章程》"},{"k":"C","v":"《中国社会主义青年团章程》"},{"k":"D","v":"《中国共产青年团章程》"}],"answer":"C","explanation":"中国社会主义青年团第一次全国代表大会通过了我国第一部团的章程是《中国社会主义青年团章程》。"},{"id":"s35","type":"single","num":35,"tag":"团史团务","stem":"（    ）年12月，中央人民政府政务院正式宣布五月四日为“青年节”。","material":[],"options":[{"k":"A","v":"1921"},{"k":"B","v":"1949"},{"k":"C","v":"1950"},{"k":"D","v":"1951"}],"answer":"B","explanation":"1949 年12月，中央人民政府政务院正式宣布五月四日为“青年节”。"},{"id":"s36","type":"single","num":36,"tag":"团史团务","stem":"中国共产主义青年团团旗旗面为红色，象征（    ）；左上角缀黄色五角星，周围环绕黄色圆圈，象征中国青年一代紧密团结在中国共产党周围。","material":[],"options":[{"k":"A","v":"革命胜利"},{"k":"B","v":"青春理想"},{"k":"C","v":"蓬勃生命"},{"k":"D","v":"缅怀历史"}],"answer":"A","explanation":"《中国共产主义青年团章程》第三十一条，中国共产主义青年团团旗旗面为红色，象征革命胜利；左上角缀黄色五角星，周围环绕黄色圆圈，象征中国青年一代紧密团结在中国共产党周围。团的重要会议以及团日活动可以使用团旗。"},{"id":"s37","type":"single","num":37,"tag":"党史国史","stem":"(   )的全称是：中国苏维埃政府、中国共产党中央为抗日救国告全体同胞书。","material":[],"options":[{"k":"A","v":"《抗战宣言》"},{"k":"B","v":"《抗日救国宣言》"},{"k":"C","v":"《八一宣言》"},{"k":"D","v":"《七一宣言》"}],"answer":"C","explanation":"正确答案是 C 选项《八一宣言》。1935 年 8 月 1 日，中国共产党中央和中国苏维埃政府为呼吁全国同胞团结抗日、反对日本帝国主义，发表了《中国苏维埃政府、中国共产党中央为抗日救国告全体同胞书》，这份文件的简称就是《八一宣言》，其全称与题干描述完全一致。其他选项中，A 选项《抗战宣言》并非历史上某一文件的标准简称，属于模糊统称；B 选项《抗日救国宣言》虽也是中共发布的抗日文件，但由中共中央于 1935 年 11 月发表，全称与题干不同；D 选项《七一宣言》并不存在，“七一” 是党的诞生纪念日，并非某份抗日宣言的简称或发布时间，因此 A、B、D 均为错误选项。"},{"id":"s38","type":"single","num":38,"tag":"时政热点","stem":"美丽中国建设“1+1+N”的实施体系中第一个“1”是(   )，这也是统揽美丽中国建设各项举措的纲领性文件。","material":[],"options":[{"k":"A","v":"《中共中央国务院关于全面推进美丽中国建设的意见》"},{"k":"B","v":"《关于建设美丽中国先行区的实施意见》"},{"k":"C","v":"《美丽城市建设实施方案》"},{"k":"D","v":"《美丽乡村建设实施方案》"}],"answer":"A","explanation":"“美丽中国建设‘1+1+N’实施体系中，第一个‘1’定位为纲领性文件，承担统揽全局的核心作用。选项 A 是中共中央国务院直接印发的顶层设计文件，从国家战略高度明确了美丽中国建设的总体要求、重点任务等，符合纲领性文件的属性；选项 B 针对‘先行区’建设，聚焦特定区域的实施路径，属于专项指导文件；选项 C、D 分别围绕‘美丽城市’‘美丽乡村’，是具体领域的实施方案，均属于体系中‘N’所涵盖的细分领域文件，因此第一个‘1’对应选项 A。"},{"id":"s39","type":"single","num":39,"tag":"时政热点","stem":"2025年1月22日，中共中央、国务院印发了《乡村全面振兴规划(2024—2027年)》，提出到2035年的目标是（    ）。","material":[],"options":[{"k":"A","v":"乡村全面振兴取得实质性进展，农业农村现代化迈上新台阶"},{"k":"B","v":"国家粮食安全根基更加稳固，农业综合生产能力稳步提升"},{"k":"C","v":"乡村产业更加兴旺，实现乡村产业全链条升级"},{"k":"D","v":"农业现代化基本实现，农村基本具备现代生活条件"}],"answer":"D","explanation":"根据《乡村全面振兴规划（2024—2027年）》，到2035年，乡村全面振兴取得决定性进展，农业现代化基本实现，农村基本具备现代生活条件。选项A中“乡村全面振兴取得实质性进展，农业农村现代化迈上新台阶”是到2027年的目标。选项B“国家粮食安全根基更加稳固，农业综合生产能力稳步提升”和选项C“乡村产业更加兴旺，实现乡村产业全链条升级”均属于2027年乡村全面振兴取得实质性进展的具体表现。因此，正确答案为D。"},{"id":"s40","type":"single","num":40,"tag":"时政热点","stem":"2025年1月20日，国家重大科技基础设施“人造太阳”(   )在安徽合肥创造新的纪录，首次完成1亿摄氏度1000秒“高质量燃烧”。","material":[],"options":[{"k":"A","v":"核聚变实验装置(ESST)"},{"k":"B","v":"核聚变实验装置(EAST)"},{"k":"C","v":"核裂变实验装置(EAST)"},{"k":"D","v":"核裂变实验装置(ESST)"}],"answer":"B","explanation":"“人造太阳” 是全超导托卡马克核聚变实验装置，其英文缩写为 EAST。2025 年 1 月 20 日，正是 EAST 在安徽合肥创造了新纪录，首次完成 1 亿摄氏度 1000 秒 “高质量燃烧”，实现了 1 亿摄氏度 1066 秒稳态长脉冲高约束模等离子体运行，刷新了托卡马克装置高约束模运行的世界纪录。核裂变实验装置与 “人造太阳” 的核聚变原理不同，所以 A、C、D 选项均错误。"},{"id":"s41","type":"single","num":41,"tag":"时政热点","stem":"2025年1月27日上午，中共中央、国务院在人民大会堂举行2025年春节团拜会。中共中央总书记、国家主席、中央军委主席习近平发表讲话。习近平指出，2025年是“十四五”规划收官之年。我们要（    ）","material":["①坚持把发展立足点放在新质生产力上","②进一步全面深化改革","③推动经济持续回升向好","④防范化解重点领域风险和外部冲击","⑤纵深推进全面从严治党"],"options":[{"k":"A","v":"①③④⑤"},{"k":"B","v":"①②③④⑤"},{"k":"C","v":"②③④⑤"},{"k":"D","v":"①②③④"}],"answer":"C","explanation":"习近平指出，2025年是“十四五”规划收官之年。我们要坚持以新时代中国特色社会主义思想为指导，全面贯彻党的二十大和二十届二中、三中全会精神，坚持稳中求进工作总基调，坚持把发展立足点放在高质量发展上，完整准确全面贯彻新发展理念，加快构建新发展格局，进一步全面深化改革，扩大高水平对外开放，防范化解重点领域风险和外部冲击，推动经济持续回升向好，保持社会和谐稳定，纵深推进全面从严治党。我们将制定“十五五”规划建议，向着宏伟目标接续奋进。"},{"id":"s42","type":"single","num":42,"tag":"时政热点","stem":"以下关于AI在政务服务领域的应用，说法正确的是（）。","material":["①深圳市福田区的AI系统公文格式修正准确率超95％，审核时间缩短90%","②山东临沂的“沂蒙慧眼”企业精准画像效率提升了60%","③AI“执法文书生成助手”可将笔录秒级转化为文书初稿","④AI目前无法在城市治理的资源配置方面提供帮助"],"options":[{"k":"A","v":"①②③"},{"k":"B","v":"②③④"},{"k":"C","v":"①②④"},{"k":"D","v":"①③④"}],"answer":"A","explanation":"深圳市福田区上线的AI数智员工，其公文格式修正准确率超95％，审核时间缩短90%，所以①正确。山东临沂的“沂蒙慧眼”企业精准画像系统，通过整合多部门数据资源，应用人工智能技术搭建算法模型，虽未明确提及效率提升具体数值，但确实提升了企业精准画像的效率，②表述合理。福田区的AI“执法文书生成助手”可将笔录秒级转化为文书初稿，③正确。而AI可以在城市治理的资源配置方面提供帮助，如华为公司高级副总裁曹既斌表示AI CITY的建设中，AI能优化决策过程，实现城市治理走向全局协同，资源高效流转，所以④错误。综上，答案选A。"},{"id":"s43","type":"single","num":43,"tag":"时政热点","stem":"以下关于2025年3月两会“反内卷”话题说法错误的是（    ）。","material":[],"options":[{"k":"A","v":"中央经济工作会议提出综合整治“内卷式”竞争"},{"k":"B","v":"整治“内卷式”竞争只需规范企业行为即可"},{"k":"C","v":"要引导行业和企业转向高品质差异化的良性竞争"},{"k":"D","v":"要加强对行政垄断行为的监管执法力度"}],"answer":"B","explanation":"整治“内卷式”竞争需要多方面共同努力，不仅仅是规范企业行为即可。去年12月中央经济工作会议提出综合整治“内卷式”竞争，规范地方政府和企业行为，所以A正确。今年两会期间，代表委员提出要引导行业和企业转向高品质差异化的良性竞争，通过创新、品质、服务、出海等多维度破“卷”，所以C正确。同时，要加快建立健全基础制度规则，破除地方保护和市场分割，加强对行政垄断行为的监管执法力度，所以D正确。而B选项说法过于片面，整治“内卷式”竞争需要政府、行业平台、企业等多方协力，故B错误。"},{"id":"s44","type":"single","num":44,"tag":"校情校史","stem":"苏州科技大学将深入学习贯彻习近平新时代中国特色社会主义思想，以“（    ）”为己任，秉承“致远至恒，务学悟真”的校训精神，坚持“立足长三角，服务全中国，辐射海内外”的办学定位，注重内涵建设强化特色发展，提升办学实力，努力将学校全面建设成为特色鲜明、品质卓越的高水平教学研究型大学。","material":[],"options":[{"k":"A","v":"全方位服务美丽中国建设"},{"k":"B","v":"推动科技创新和产业创新融合"},{"k":"C","v":"培养环保创新型人才"},{"k":"D","v":"推动江苏经济高质量发展"}],"answer":"A","explanation":"苏州科技大学将深入学习贯彻习近平新时代中国特色社会主义思想，以“全方位服务美丽中国建设”为己任，秉承“致远至恒，务学悟真”的校训精神，坚持“立足长三角，服务全中国，辐射海内外”的办学定位，注重内涵建设强化特色发展。提升办学实力，努力将学校全面建设成为特色鲜明、品质卓越的高水平教学研究型大学。"},{"id":"s45","type":"single","num":45,"tag":"校情校史","stem":"2024年7月29日下午，苏州科技大学在行政楼五楼第二会议室召开党委理论学习中心组（扩大）学习会。校党委副书记、校长顾菊平强调，学习好、宣传好、贯彻好党的二十届三中全会精神要在(   )、(   )、(   )三个方面下功夫。","material":["①寓教于学","②学深悟透","③宣传阐释","④贯彻落实"],"options":[{"k":"A","v":"①②③"},{"k":"B","v":"①②④"},{"k":"C","v":"①③④"},{"k":"D","v":"②③④"}],"answer":"D","explanation":"2024年7月29日下午，苏州科技大学在行政楼五楼第二会议室召开党委理论学习中心组（扩大）学习会。校党委副书记、校长顾菊平强调，学习好、宣传好、贯彻好党的二十届三中全会精神要在① 贯彻落实 ②学深悟透      ③宣传阐释三个方面下功夫。"},{"id":"s46","type":"single","num":46,"tag":"校情校史","stem":"苏州科技大学的校训是（    ）。","material":[],"options":[{"k":"A","v":"至远至恒、悟学务真"},{"k":"B","v":"至远致恒、务学悟真"},{"k":"C","v":"致远至恒、悟学务真"},{"k":"D","v":"致远至恒、务学悟真"}],"answer":"D","explanation":"苏州科技大学校训是致远至恒、务学悟真。诸葛亮《诫子书》中有“非宁静无以致远”句，此句中致远正来源于此。本句话的意思是：如果能够以最大的恒心潜心治学，就一定能够悟出真正的道理。"},{"id":"m1","type":"multi","num":1,"tag":"人文常识","stem":"1914年11月，梁启超到清华大学演讲时，即以“天行健，君子以自强不息”“地势坤，君子以厚德载物”激励学子努力成为“真君子”，“天行健，君子以自强不息”出自（    ）中的乾卦（    ）。","material":[],"options":[{"k":"A","v":"《尚书》"},{"k":"B","v":"《周易》"},{"k":"C","v":"《象传》"},{"k":"D","v":"《象辞》"}],"answer":"BC","explanation":"1914年11月，梁启超到清华大学演讲时，即以“天行健，君子以自强不息”“地势坤，君子以厚德载物”激励学子努力成为“真君子”，“天行健，君子以自强不息”出自《周易》中的乾卦《象传》。"},{"id":"m2","type":"multi","num":2,"tag":"党的二十大精神","stem":"党的二十大报告指出，我们要健全人民当家作主制度体系，扩大人民有序政治参与，保证人民依法实行（    ）、民主管理、民主监督，发挥人民群众积极性、主动性、创造性，巩固和发展生动活泼、安定团结的政治局面。","material":[],"options":[{"k":"A","v":"民主参政"},{"k":"B","v":"民主选举"},{"k":"C","v":"民主协商"},{"k":"D","v":"民主决策"}],"answer":"BCD","explanation":"我们要健全人民当家作主制度体系，扩大人民有序政治参与，保证人民依法实行民主近举。民主协商、民主决策、民主管理、民主监督，发挥人民群众积板性、主动性、创造性，环面和发展生动活泼、安定团结的政治局面，"},{"id":"m3","type":"multi","num":3,"tag":"党的二十大精神","stem":"习近平总书记在党的二十大报告指出：“加快实施创新驱动发展战略。坚持面向（    ），加快实现高水平科技自立自强。”","material":[],"options":[{"k":"A","v":"世界科技前沿"},{"k":"B","v":"经济主战场"},{"k":"C","v":"国家重大需求"},{"k":"D","v":"人民生命健康"}],"answer":"ABCD","explanation":"以习近平同志为核心的党中央高瞻远瞩、统揽全局，对我国科技创新作出战略擘画，在党的二十大报告明确了科技创新领域2035年总体目标和未来5年主要任务，对加快实施创新驱动战略作出专门部署：坚持面向世界科技前沿、面向经济主战场、面向国家重大需求、面向人民生命健康，加快实现高水平科技自立自强。以国家战略需求为导向，集聚力量进行原创性引领性科技攻关，坚决打赢关键核心技术攻坚战。"},{"id":"m4","type":"multi","num":4,"tag":"党的二十大精神","stem":"二十大中提出，实施科教兴国战略，强化现代化建设人才支撑，需要（    ）。","material":[],"options":[{"k":"A","v":"办好人民满意的教育"},{"k":"B","v":"加快实施创新驱动发展战略"},{"k":"C","v":"完善科技创新体系"},{"k":"D","v":"深入实施人才强国战略"}],"answer":"ABCD","explanation":"二十大中提出，实施科教兴国战略，强化现代化建设人才支撑，需要办好人民满意的教育、加快实施创新驱动发展战略、完善科技创新体系、深入实施人才强国战略。"},{"id":"m5","type":"multi","num":5,"tag":"党的二十大精神","stem":"党的二十大报告指出，十八大召开至今已经十年了。十年来，我们经历了对党和人民事业具有重大现实意义和深远历史意义的三件大事（    ）。","material":[],"options":[{"k":"A","v":"迎来中国共产党成立一百周年"},{"k":"B","v":"迎来共产主义青年团成立一百周年"},{"k":"C","v":"中国特色社会主义进入新时代"},{"k":"D","v":"完成脱贫攻坚、全面建成小康社会的历史任务,实现第一个百年奋斗目标"}],"answer":"ACD","explanation":"党的二十大报告指出，党的十八大召开十年来，我们经历了对党和人民事业具有重大现实意义和深远历史意义的三件大事：一是迎来中国共产党成立一百周年，二是中国特色社会主义进入新时代，三是完成脱贫攻坚、全面建成小康社会的历史任务，实现第一个百年奋斗目标。"},{"id":"m6","type":"multi","num":6,"tag":"时政热点","stem":"习近平总书记在2024年新年贺词中指出，今年是新中国成立75周年。……要全面深化改革开放，进一步提振发展信心，增强经济活力，以更大力度（    ）。要继续支持香港、澳门发挥自身优势，在更好融入国家发展大局中保持长期繁荣稳定。祖国统一是历史必然，两岸同胞要携手同心，共享民族复兴的伟大荣光。","material":[],"options":[{"k":"A","v":"促发展"},{"k":"B","v":"办教育"},{"k":"C","v":"兴科技"},{"k":"D","v":"育人才"}],"answer":"BCD","explanation":"习近平总书记在2024年新年贺词中指出，今年是新中国成立75周年。我们要坚定不移推进中国式现代化，完整、准确、全面贯彻新发展理念，加快构建新发展格局，推动高质量发展，统筹好发展和安全。要坚持稳中求进、以进促稳、先立后破，巩固和增强经济回升向好态势，实现经济行稳致远。要全面深化改革开放，进一步提振发展信心，增强经济活力，以更大力度办教育、兴科技、育人才。要继续支持香港、澳门发挥自身优势，在更好融入国家发展大局中保持长期繁荣稳定。祖国统一是历史必然，两岸同胞要携手同心，共享民族复兴的伟大荣光。"},{"id":"m7","type":"multi","num":7,"tag":"党的二十大精神","stem":"党和国家深入贯彻以人民为中心的发展思想，在幼有所育、学有所教、劳有所得、病有所医、老有所养、住有所居、弱有所扶上持续用力，建成世界上规模最大的（    ），人民群众获得感、幸福感、安全感更加充实、更有保障、更可持续，共同富裕取得新成效。","material":[],"options":[{"k":"A","v":"教育体系"},{"k":"B","v":"社会保障体系"},{"k":"C","v":"医疗体系"},{"k":"D","v":"法律体系"}],"answer":"ABC","explanation":"习近平总书记在二十大报告中指出，我们深入贯彻以人民为中心的发展思想，在幼有所育、学有所教、劳有所得、病有所医、老有所养、住有所居、弱有所扶上持续用力，建成世界上规模最大的教育体系、社会保障体系、医疗卫生体系，人民群众获得感、幸福感、安全感更加充实、更有保障、更可持续，共同富裕取得新成效。"},{"id":"m8","type":"multi","num":8,"tag":"党的二十大精神","stem":"全面建成社会主义现代化强国，总的战略安排是分两步走：（    ）。","material":[],"options":[{"k":"A","v":"从二〇二〇年到二〇三五年基本实现社会主义现代化"},{"k":"B","v":"从二〇二〇年到二〇三五年实现社会主义现代化"},{"k":"C","v":"从二〇三五年到本世纪中叶把我国建成富强民主文明和谐美丽的社会主义现代化强国"},{"k":"D","v":"从二〇三五年到本世纪中叶把我国建成社会主义现代化强国"}],"answer":"AC","explanation":"党的二十大报告提出，全面建成社会主义现代化强国，总的战略安排是分两步走：从二〇二〇年到二〇三五年基本实现社会主义现代化；从二〇三五年到本世纪中叶把我国建成富强民主文明和谐美丽的社会主义现代化强国。未来五年是全面建设社会主义现代化国家开局起步的关键时期"},{"id":"m9","type":"multi","num":9,"tag":"党史国史","stem":"土地革命战争时期，中国共产党走上了“工农武装割据”的道路，实行（    ）三者结合起来的方针。","material":[],"options":[{"k":"A","v":"统一战线"},{"k":"B","v":"武装斗争"},{"k":"C","v":"土地革命"},{"k":"D","v":"根据地建设"}],"answer":"BCD","explanation":"1928年10月，湘赣边界党的第二次代表大会通过了毛泽东起草的决议案。这个决议案的第一部分“政治问题和边界党的任务”，即毛泽东《中国的红色政权为什么能够存在？》一文。毛泽东在文中指明了中国革命的性质、任务以及中国红色政权的实质，总结了井冈山根据地及其他地区建立小块红色政权的经验教训，首次提出“工农武装割据”的重要思想。它是指在中国共产党领导下，以武装斗争为主要形式，以土地革命为中心内容，以农村革命根据地为战略阵地的三者密切结合。"},{"id":"m10","type":"multi","num":10,"tag":"党史国史","stem":"近代以来，中华民族面对的两大历史任务是（    ）。","material":[],"options":[{"k":"A","v":"反对帝国主义"},{"k":"B","v":"反对封建主义"},{"k":"C","v":"求得民族独立和人民解放"},{"k":"D","v":"实现国家繁荣富强和人民共同富裕"}],"answer":"CD","explanation":"从近代以来中国人民和中华民族面临的历史任务看。1840年鸦片战争后，中国逐渐成为半殖民地半封建国家。中华民族面对着两大历史任务：一是求得民族独立和人民解放；二是实现国家繁荣富强和人民共同富裕。前一任务是为后一任务扫清障碍，创造必要的前提。这两大历史任务，共同构成了“实现中华民族伟大复兴”主题的基本内涵，也就决定了“实现中华民族伟大复兴”需要分成若干个时期分阶段推进。"},{"id":"m11","type":"multi","num":11,"tag":"习近平新时代中国特色社会主义思想","stem":"中国特色社会主义事业战略布局包括（    ）。","material":[],"options":[{"k":"A","v":"全面建设社会主义现代化国家"},{"k":"B","v":"全面深化改革"},{"k":"C","v":"全面依法治国"},{"k":"D","v":"全面从严治党"}],"answer":"ABCD","explanation":"习近平新时代中国特色社会主义思想中指出，明确中国特色社会主义事业战略布局是全面建设社会主义现代化国家、全面深化改革、全面依法治国、全面从严治党四个全面。"},{"id":"m12","type":"multi","num":12,"tag":"习近平新时代中国特色社会主义思想","stem":"全面小康中的“全面”主要包括哪些内涵（    ）。","material":[],"options":[{"k":"A","v":"覆盖的领域要全面"},{"k":"B","v":"覆盖的人口要全面"},{"k":"C","v":"赶超发达国家要全面"},{"k":"D","v":"覆盖的区域要全面"}],"answer":"ABD","explanation":"习近平总书记在党的十八届五中全会第二次全体会议上的讲话中指出，全面小康，覆盖的领域要全面，是五位一体全面进步的小康；覆盖的人口要全面，是惠及全体人民的小康；覆盖的区域要全面，是城乡区域共同的小康。"},{"id":"m13","type":"multi","num":13,"tag":"党章党规党纪","stem":"党的各级纪律检查委员会的主要任务是（    ）。","material":[],"options":[{"k":"A","v":"维护党的章程和其他党内法规"},{"k":"B","v":"检查党的路线、方针、政策和决议的执行情况"},{"k":"C","v":"协助党的委员会推进全面从严治党、加强党风建设"},{"k":"D","v":"组织协调反腐败工作"}],"answer":"ABCD","explanation":"参照《中国共产党党章》第四十六条，党的各级纪律检查委员会是党内监督专责机关，主要任务是：维护党的章程和其他党内法规，检查党的路线、方针、政策和决议的执行情况，协助党的委员会推进全面从严治党、加强党风建设和组织协调反腐败工作。"},{"id":"m14","type":"multi","num":14,"tag":"党章党规党纪","stem":"巩固和发展爱国统一战线。坚持（    ）,支持民主党派按照中国特色社会主义参政党要求更好履行职能。","material":[],"options":[{"k":"A","v":"长期共存"},{"k":"B","v":"互相监督"},{"k":"C","v":"肝胆相照"},{"k":"D","v":"荣辱与共"}],"answer":"ABCD","explanation":"十九大汇报中指出,巩固和发展爱国统一战线,坚持长期共存、互相监督、肝胆相照、荣辱与共,支持民主党派按照中国特色社会主义参政党规定更好履行职能"},{"id":"m15","type":"multi","num":15,"tag":"党史国史","stem":"被称为中国共产党历史上的两个伟大转折点是（    ）。","material":[],"options":[{"k":"A","v":"八七会议"},{"k":"B","v":"遵义会议"},{"k":"C","v":"十一届三中全会"},{"k":"D","v":"九一会议"}],"answer":"BC","explanation":"中国共产党历史上的两个伟大转折点是遵义会议、十一届三中全会。"},{"id":"m16","type":"multi","num":16,"tag":"党史国史","stem":"五四时期,研究和宣传马克思主义的社团有（    ）。","material":[],"options":[{"k":"A","v":"马克思主义研究会"},{"k":"B","v":"马克思学说研究会"},{"k":"C","v":"新民学会"},{"k":"D","v":"觉悟社"}],"answer":"ABCD","explanation":"五四时期,研究和宣传马克思主义的社团有马克思主义研究会、马克思学说研究会、新民学会、觉悟社。"},{"id":"m17","type":"multi","num":17,"tag":"党章党规党纪","stem":"加强思想政治建设的“三讲”是指（    ）。","material":[],"options":[{"k":"A","v":"讲学习"},{"k":"B","v":"讲发展"},{"k":"C","v":"讲政治"},{"k":"D","v":"讲正气"}],"answer":"ACD","explanation":"三讲是指讲政治，讲学习，讲正气。\n讲政治”：包括政治方向、政治立场、政治观点、政治纪律、政治鉴别力、政治敏锐性。要学会从政治上观察问题、分析问题和处理问题，确保改革开放和社会主义现代化建设健康、顺利发展。\n讲学习”：主要是学理论，学知识，学科技。具体是学习中国特色社会主义理论，学习社会主义市场经济理论，学习社会主义市场经济的知识、现代科技知识、法律知识、历史知识等，以充实自己，开阔眼界，提高领导水平。\n讲正气”：就是要继承和发扬我们党在长期革命和建设事业中形成的好传统、好作风。坚持真理，坚持原则，坚持同一切歪风邪气和各种腐败现象作斗争，保证我们党永不变色，国家长治久安，兴旺发达。"},{"id":"m18","type":"multi","num":18,"tag":"习近平新时代中国特色社会主义思想","stem":"改革开放以来我国取得一切成绩和进步的根本原因,归结起来是（    ）。","material":[],"options":[{"k":"A","v":"开辟了中国特色社会主义道路"},{"k":"B","v":"建立了社会主义市场经济体制"},{"k":"C","v":"形成了中国特色社会主义理论体系"},{"k":"D","v":"确立了中国特色社会主义制度"}],"answer":"ACD","explanation":"改革开放以来我国取得一切成绩和进步的根本原因,归结起来是开辟了中国特色社会主义道路，形成了中国特色社会主义理论体系，确立了中国特色社会主义制度。"},{"id":"m19","type":"multi","num":19,"tag":"习近平新时代中国特色社会主义思想","stem":"坚持党总揽全局、协调各方的领导核心作用，主要是坚持（    ）有机统一，改革和完善党的领导方式和执政方式，提高党的领导水平和执政水平。","material":[],"options":[{"k":"A","v":"人民当家作主"},{"k":"B","v":"党的领导"},{"k":"C","v":"依法治国"},{"k":"D","v":"经济建设"}],"answer":"ABC","explanation":"坚持党总揽全局、协调各方的领导核心作用，主要是坚持人民当家作主、党的领导、依法治国有机统一，改革和完善党的领导方式和执政方式，提高党的领导水平和执政水平。"},{"id":"m20","type":"multi","num":20,"tag":"习近平新时代中国特色社会主义思想","stem":"党和国家的各项工作都要把（    ），作为总的出发点和检验标准。","material":[],"options":[{"k":"A","v":"有利于发展社会主义社会的生产力"},{"k":"B","v":"有利于增强社会主义国家的综合国力"},{"k":"C","v":"有利于提高人民的生活水平"},{"k":"D","v":"有利于构建社会主义和谐社会"}],"answer":"ABC","explanation":"党和国家的各项工作都要把有利于发展社会主义社会的生产力，有利于增强社会主义国家的综合国力，有利于提高人民的生活水平，作为总的出发点和检验标准。"},{"id":"m21","type":"multi","num":21,"tag":"党章党规党纪","stem":"党的纪律主要包括（    ）。","material":[],"options":[{"k":"A","v":"政治纪律、组织纪律"},{"k":"B","v":"学习纪律、干部纪律"},{"k":"C","v":"廉洁纪律、群众纪律"},{"k":"D","v":"工作纪律、生活纪律"}],"answer":"ACD","explanation":"党的十九大党章修正案第四十条明确党的纪律主要包括政治纪律、组织纪律、廉洁纪律、群众纪律、工作纪律、生活纪律。"},{"id":"m22","type":"multi","num":22,"tag":"党章党规党纪","stem":"新时代坚定政治领导要做到（    ）。","material":[],"options":[{"k":"A","v":"坚决做到“两个维护”"},{"k":"B","v":"完善党的领导体制"},{"k":"C","v":"改进党的领导方式"},{"k":"D","v":"坚持党的政治路线"}],"answer":"ABC","explanation":"新时代坚定政治领导要做到坚决做到“两个维护”，完善党的领导体制，改进党的领导方式。"},{"id":"m23","type":"multi","num":23,"tag":"习近平新时代中国特色社会主义思想","stem":"中国特色社会主义事业总体布局是经济建设、（    ）五位一体。","material":[],"options":[{"k":"A","v":"政治建设"},{"k":"B","v":"文化建设"},{"k":"C","v":"社会建设"},{"k":"D","v":"生态文明建设"}],"answer":"ABCD","explanation":"习近平新时代中国特色社会主义思想中指出，明确中国特色社会主义事业总体布局是经济建设、政治建设、文化建设、社会建设、生态文明建设五位一体。"},{"id":"m24","type":"multi","num":24,"tag":"党史国史","stem":"学习党史要求我们大家做到的是（    ）。","material":[],"options":[{"k":"A","v":"学史明理"},{"k":"B","v":"学史增信"},{"k":"C","v":"学史崇德"},{"k":"D","v":"学史力行"}],"answer":"ABCD","explanation":"2021年2月20日上午，中共中央总书记、国家主席、中央军委主席习近平出席会议并发表重要讲话。他强调，在全党开展党史学习教育，是党中央立足党的百年历史新起点、统筹中华民族伟大复兴战略全局和世界百年未有之大变局、为动员全党全国满怀信心投身全面建设社会主义现代化国家而作出的重大决策。全党同志要做到学史明理、学史增信、学史崇德、学史力行，学党史、悟思想、办实事、开新局，以昂扬姿态奋力开启全面建设社会主义现代化国家新征程，以优异成绩迎接建党一百周年。"},{"id":"m25","type":"multi","num":25,"tag":"党史国史","stem":"为何要总结党的百年奋斗的重大成就和历史经验？（    ）","material":[],"options":[{"k":"A","v":"在建党百年历史条件下开启全面建设社会主义现代化国家新征程、在新时代坚持和发展中国特色社会主义的需要"},{"k":"B","v":"增强“四个意识”，坚定“四个自信”，做到“两个维护”，确保全党步调一致向前进的需要"},{"k":"C","v":"推进党的自我革命、提高全党斗争本领和应对风险挑战能力、永葆党的生机活力、团结带领全国各族人民为实现中华民族伟大复兴的中国梦而继续奋斗的需要"},{"k":"D","v":"是新时代应对国际国内新形势的需要"}],"answer":"ABC","explanation":"《中国共产党第十九届中央委员会第六次全体会议公报》中指出，全会认为，总结党的百年奋斗重大成就和历史经验，是在建党百年历史条件下开启全面建设社会主义现代化国家新征程、在新时代坚持和发展中国特色社会主义的需要；是增强政治意识、大局意识、核心意识、看齐意识，坚定道路自信、理论自信、制度自信、文化自信，做到坚决维护习近平同志党中央的核心、全党的核心地位，坚决维护党中央权威和集中统一领导，确保全党步调一致向前进的需要；是推进党的自我革命、提高全党斗争本领和应对风险挑战能力、永葆党的生机活力、团结带领全国各族人民为实现中华民族伟大复兴的中国梦而继续奋斗的需要。全党要坚持唯物史观和正确党史观，从党的百年奋斗中看清楚过去我们为什么能够成功、弄明白未来我们怎样才能继续成功，从而更加坚定、更加自觉地践行初心使命，在新时代更好坚持和发展中国特色社会主义。"},{"id":"m26","type":"multi","num":26,"tag":"团史团务","stem":"团支部是团的基础组织、担负直接（    ）的职责。","material":[],"options":[{"k":"A","v":"团结团员、引导团员、凝聚团员"},{"k":"B","v":"教育团员、管理团员、监督团员"},{"k":"C","v":"组织青年、宣传青年、凝聚青年、服务青年"},{"k":"D","v":"教育青年、管理青年、宣传青年、服务青年"}],"answer":"BC","explanation":"《团章》第五章第二十五条指出，团支部是团的基础组织，担负直接教育团员、管理团员、监督团员和组织青年、宣传青年、凝聚青年、服务青年的职责。"},{"id":"m27","type":"multi","num":27,"tag":"团史团务","stem":"团的民主集中制的基本原则是（    ）。","material":[],"options":[{"k":"A","v":"团员个人服从组织"},{"k":"B","v":"组织服从团员个人"},{"k":"C","v":"少数服从多数"},{"k":"D","v":"下级组织服从上级组织"}],"answer":"ACD","explanation":"团的民主集中制的基本原则是团员个人服从组织，少数服从多数，下级组织服从上级组织。"},{"id":"m28","type":"multi","num":28,"tag":"团史团务","stem":"中国共产主义青年团是（    ）。","material":[],"options":[{"k":"A","v":"中国共产党领导的先进青年的群众组织"},{"k":"B","v":"广大青年在实践中学习中国特色社会主义和共产主义的学校"},{"k":"C","v":"中国共产党的助手和后备军"},{"k":"D","v":"建设社会主义和共产主义的预备军"}],"answer":"ABC","explanation":"中国共产主义青年团的性质是中国共产党领导的先进青年的群众组织，是广大青年在实践中学习中国特色社会主义和共产主义的学校，是中国共产党的助手和后备军。"},{"id":"m29","type":"multi","num":29,"tag":"团史团务","stem":"中国共产主义青年团的（    ）是中国共产主义青年团的象征和标志。","material":[],"options":[{"k":"A","v":"团章"},{"k":"B","v":"团旗"},{"k":"C","v":"团徽"},{"k":"D","v":"团歌"}],"answer":"BCD","explanation":"《中国共产主义青年团章程》第八章第四十条指出，中国共产主义青年团的团旗、团徽、团歌是中国共产主义青年团的象征和标志。要按照规定制作和使用团旗、团徽、团歌。"},{"id":"m30","type":"multi","num":30,"tag":"青年工作","stem":"习近平总书记指出：“共青团要把牢新时代青年工作的主题，最广泛地把青年团结起来、组织起来、动员起来，激励广大青年增强历史责任感和使命感，激发强国有我的青春激情，在强国建设、民族复兴伟业中勇当（    ）。","material":[],"options":[{"k":"A","v":"先锋队"},{"k":"B","v":"突击队"},{"k":"C","v":"冲锋队"},{"k":"D","v":"预备队"}],"answer":"AB","explanation":"2023年6月26日，习近平总书记在同团中央新一届领导班子成员集体谈话时指出：“共青团要把牢新时代青年工作的主题，最广泛地把青年团结起来、组织起来、动员起来，激励广大青年增强历史责任感和使命感，激发强国有我的青春激情，在强国建设、民族复兴伟业中勇当先锋队、突击队。”"},{"id":"m31","type":"multi","num":31,"tag":"团史团务","stem":"为深入贯彻习近平总书记在同团中央新一届领导班子集体谈话时的重要讲话精神，落实团十九大和团十九届二中全会工作部署，共青团中央印发了《关于新时代新征程加强和改进团员队伍建设工作的意见》，提出要大力锻造有信仰（    ）的新时代团员队伍。","material":[],"options":[{"k":"A","v":"讲政治"},{"k":"B","v":"重品行"},{"k":"C","v":"争先锋"},{"k":"D","v":"守纪律"}],"answer":"ABCD","explanation":"为深入贯彻习近平总书记在同团中央新一届领导班子集体谈话时的重要讲话精神，落实团十九大和团十九届二中全会工作部署，共青团中央印发了《关于新时代新征程加强和改进团员队伍建设工作的意见》，提出要大力锻造有信仰、讲政治、重品行、争先锋、守纪律的新时代团员队伍。"},{"id":"m32","type":"multi","num":32,"tag":"团史团务","stem":"共青团支部的“三会二制一课”制度，其中“三会”是指（    ）。","material":[],"options":[{"k":"A","v":"团支部委员会"},{"k":"B","v":"团支部评议大会"},{"k":"C","v":"团支部大会"},{"k":"D","v":"团小组会"}],"answer":"ACD","explanation":"“三会二制一课”是指支部大会、支部委员会、团小组会、团员教育评议制度、团员年度团籍注册制度和团课，是团的组织生活的基本制度。"},{"id":"m33","type":"multi","num":33,"tag":"团史团务","stem":"团员必须履行的义务是（    ）。","material":[],"options":[{"k":"A","v":"努力学习马克思列宁主义、毛泽东思想、邓小平理论、“三个代表”重要思想、科学发展观、习近平新时代中国特色社会主义思想"},{"k":"B","v":"接受国防教育，增强国防意识，积极履行保卫祖国的义务"},{"k":"C","v":"虚心向人民群众学习，热心帮助青年进步，及时反映青年的意见和要求"},{"k":"D","v":"宣传、执行党的基本路线和各项方针政策"}],"answer":"ABCD","explanation":"根据《团章》第一章第二条规定，团员必须履行义务当中包括：努力学习马克思列宁主义、毛泽东思想、邓小平理论、“三个代表”重要思想、科学发展观、习近平新时代中国特色社会主义思想。宣传、执行党的基本路线和各项方针政策，积极参加改革开放和社会主义现代化建设。接受国防教育，增强国防意识，积极履行保卫祖国的义务。虚心向人民群众学习，热心帮助青年进步，及时反映青年的意见和要求。"},{"id":"m34","type":"multi","num":34,"tag":"时政热点","stem":"杭州亚运会、亚残运会碳中和工作实现了多个“首次”，包括以下（    ）。","material":[],"options":[{"k":"A","v":"开闭幕式首次使用“数字烟花”代替“实物烟花"},{"k":"B","v":"主火炬首次使用甲醇作为燃料实现二氧化碳循环利用"},{"k":"C","v":"首次发行大型活动碳中和数字纪念奖牌"},{"k":"D","v":"在亚运会历史上首次实现全部场馆绿电供应"}],"answer":"ABCD","explanation":"杭州亚运会、亚残运会碳中和工作实现了多个“首次”，包括开闭幕式首次使用“数字烟花”代替“实物烟花；主火炬首次使用甲醇作为燃料实现二氧化碳循环利用；首次发行大型活动碳中和数字纪念奖牌；在亚运会历史上首次实现全部场馆绿电供应"},{"id":"m35","type":"multi","num":35,"tag":"习近平新时代中国特色社会主义思想","stem":"党要承担起推动中国社会进步的历史责任，必须紧紧抓住发展这个执政兴国的第一要务,把坚持党的先进性和发挥社会主义制度的优越性，落实到(   )上来，推动社会全面进步，促进人的全面发展。","material":[],"options":[{"k":"A","v":"发展现代科技"},{"k":"B","v":"发展先进生产力"},{"k":"C","v":"发展先进文化"},{"k":"D","v":"实现最广大人民的根本利益"}],"answer":"BCD","explanation":"党要承担起推动中国社会进步的历史责任，必须紧紧抓住发展这个执政兴国的第一要务，把坚持党的先进性和发挥社会主义制度的优越性，落实到发展先进生产力、发展先进文化、实现最广大人民的根本利益上来，推动社会全面进步，促进人的全面发展。这一表述出自党的十六大报告，强调了发展先进生产力是基础，发展先进文化是精神支撑，实现最广大人民的根本利益是出发点和落脚点，三者缺一不可，共同构成了党推动社会进步的重要着力点，而发展现代科技包含在发展先进生产力和先进文化的范畴之中，故答案为BCD。"},{"id":"m36","type":"multi","num":36,"tag":"党章党规党纪","stem":"在党员教育工作中，要深入学习领会习近平新时代中国特色社会主义思想的核心要义、（    ），增强（    ）和情感融入。","material":[],"options":[{"k":"A","v":"学习纪律、组织建设"},{"k":"B","v":"基本精神、实践要求"},{"k":"C","v":"政治自觉、理论自信"},{"k":"D","v":"中心观点、深刻内涵"}],"answer":"BC","explanation":"在党员教育工作中，要深入学习领会习近平新时代中国特色社会主义思想的核心要义、基本精神、实践要求，增强政治自觉、理论自信和情感融入。"},{"id":"m37","type":"multi","num":37,"tag":"时政热点","stem":"2025 年 1 月 16 日出版的第 2 期《求是》杂志发表了习近平总书记重要文章《进一步全面深化改革中的几个重大理论和实践问题》。其中，文章指出为进一步全面深化改革需要（    ）。","material":[],"options":[{"k":"A","v":"坚持守正创新"},{"k":"B","v":"坚持用科学方法指导和推进改革"},{"k":"C","v":"摒弃传统制度框架来推进改革"},{"k":"D","v":"营造进一步全面深化改革的良好氛围"}],"answer":"ABD","explanation":"2025年1月16日出版的第2期《求是》杂志发表习近平总书记的重要文章《进一步全面深化改革中的几个重大理论和实践问题》，文章指出，坚持守正创新、坚持用科学方法指导和推进改革、营造进一步全面深化改革的良好氛围。"},{"id":"m38","type":"multi","num":38,"tag":"时政热点","stem":"新质生产力由（）而催生。","material":[],"options":[{"k":"A","v":"技术革命性突破"},{"k":"B","v":"生产要素创新性配置"},{"k":"C","v":"产业深度转型升级"},{"k":"D","v":"高度智能化"}],"answer":"ABC","explanation":"新质生产力由技术革命性突破、生产要素创新性配置、产业深度转型升级而催生。"},{"id":"m39","type":"multi","num":39,"tag":"时政热点","stem":"2025年1月19日，中共中央、国务院印发了《教育强国建设规划纲要(2024—2035年)》(以下简称《纲要》)，并发出通知，要求各地区各部门结合实际认真贯彻落实。关于《纲要》提出的主要目标，下列说法正确的是（    ）。","material":[],"options":[{"k":"A","v":"到2027年，教育强国建设取得重要阶段性成效"},{"k":"B","v":"到2027年，高质量教育体系全面建成"},{"k":"C","v":"到2035年，建成教育强国"},{"k":"D","v":"到2035年，教育现代化总体实现"}],"answer":"ACD","explanation":"根据《教育强国建设规划纲要（2024—2035年）》，到2027年，教育强国建设取得重要阶段性成效，各级教育普及水平持续巩固提升，高质量教育体系初步形成，而非全面建成，所以A正确，B错误。到2035年，建成教育强国，党对教育事业全面领导的制度体系和工作机制系统完备，高质量教育体系全面建成，教育现代化总体实现，所以C、D正确。"},{"id":"m40","type":"multi","num":40,"tag":"校情校史","stem":"苏州科技大学由（    ）合并组建而成。","material":[],"options":[{"k":"A","v":"原苏州城建环保学院"},{"k":"B","v":"原苏州建设科技学院"},{"k":"C","v":"原苏州教育师范学院"},{"k":"D","v":"原苏州铁道师范学院"}],"answer":"AD","explanation":"苏州科技大学由原苏州城建环保学院和原苏州铁道师范学院合并组建而成。"},{"id":"m41","type":"multi","num":41,"tag":"时政热点","stem":"据2025年全国两会调查结果，网民投票关注度位列前三的热词分别是（    ）。","material":[],"options":[{"k":"A","v":"民生保障"},{"k":"B","v":"正风反腐"},{"k":"C","v":"科技创新"},{"k":"D","v":"社会治理"}],"answer":"ABD","explanation":"根据人民网2025年1月27日至2月28日开展的第24次全国两会调查，网民投票结果显示，“民生保障”“正风反腐”“社会治理”三大热词备受关注，位列前三。“民生保障”因过去一年诸多便民惠民举措赢得网民认可而位列榜首，“正风反腐”因2024年反腐成效显著以及网民对整治民生领域“微腐败”等方面的关注而位居第二，“社会治理”则因寄托着网民对安定有序美好生活的向往而排在第三。科技创新并不在前三热词之列，所以答案选ABD。"},{"id":"m42","type":"multi","num":42,"tag":"习近平新时代中国特色社会主义思想","stem":"习近平总书记提出，把铸牢中华民族共同体意识作为新时代党的民族工作和民族地区各项工作的主线，实现了党在民族工作理论和实践上的重大创新。关于铸牢中华民族共同体意识，下列说法正确的有（  ）。","material":[],"options":[{"k":"A","v":"铸牢中华民族共同体意识是巩固和发展平等团结互助和谐社会主义民族关系的必然要求"},{"k":"B","v":"要引导各族群众牢固树立休戚与共、荣辱与共、生死与共、命运与共的共同体理念"},{"k":"C","v":"对伟大祖国和中华民族的认同是铸牢中华民族共同体意识的政治保证"},{"k":"D","v":"交往交流交融，是增进民族团结、铸牢中华民族共同体意识、推进中华民族共同体建设的必由之路"}],"answer":"ABD","explanation":"铸牢中华民族共同体意识是巩固和发展平等团结互助和谐社会主义民族关系的必然要求，A 正确。要引导各族群众牢固树立休戚与共、荣辱与共、生死与共、命运与共的共同体理念，这是铸牢中华民族共同体意识的重要内容，B 正确。坚持中国共产党的领导是铸牢中华民族共同体意识的政治保证，而不是对伟大祖国和中华民族的认同，C 错误。交往交流交融是增进民族团结、铸牢中华民族共同体意识、推进中华民族共同体建设的必由之路，D 正确。故答案为 ABD。"},{"id":"m43","type":"multi","num":43,"tag":"党史国史","stem":"2025年是中国人民抗日战争暨世界反法西斯战争胜利80周年。下列关于抗日战争时期历史事件的表述，正确的是（ ）。","material":[],"options":[{"k":"A","v":"皖南事变标志着抗战进入相持阶段"},{"k":"B","v":"百团大战中，八路军在华北地区发动破袭战的主要目标是摧毁日军的交通线和据点"},{"k":"C","v":"淞沪会战是整个中日战争中进行的规模最大、战斗最惨烈的一场战役"},{"k":"D","v":"湘西会战是抗日战争中中国军队在正面战场的最后一次大规模防御作战"}],"answer":"BCD","explanation":"抗战进入相持阶段的标志是 1938 年 10 月广州、武汉的沦陷，而非皖南事变，所以 A 选项错误。百团大战中，八路军在华北地区发动破袭战的主要目标是摧毁日军的交通线和据点，B 选项正确。淞沪会战是中国全民族抗战爆发后的首场大型会战，历时 3 个月，粉碎了日军 “三个月灭亡中国” 的狂妄计划，是整个中日战争中进行的规模最大、战斗最惨烈的一场战役之一，C 选项正确。1945 年的湘西会战是抗日战争中中国军队在正面战场的最后一次大规模防御作战，中国军队取得全面胜利，粉碎了日军打通湘桂线的企图，D 选项正确。"},{"id":"m44","type":"multi","num":44,"tag":"校情校史","stem":"2024年，我校成功获批博士学位授予单位和（    ）一级学科博士学位授权点，这在学校的发展史上具有里程碑意义，标志着学校办学层次取得历史性突破。","material":[],"options":[{"k":"A","v":"计算机科学与技术"},{"k":"B","v":"土木工程"},{"k":"C","v":"环境科学与工程"},{"k":"D","v":"城乡规划学"}],"answer":"BCD","explanation":"2024年，苏州科技大学成功获批博士学位授予单位，同时获批的一级学科博士学位授权点有土木工程、环境科学与工程、城乡规划学。这是学校发展史上的重要里程碑，标志着学校办学层次取得历史性突破，为学校的高质量发展注入了强劲动能。而计算机科学与技术并不在此次获批的博士学位授权点之列，所以答案选BCD。"},{"id":"m45","type":"multi","num":45,"tag":"时政热点","stem":"从文化角度看，《哪吒2》的成功带来的启示包括以下哪项？（    ）","material":[],"options":[{"k":"A","v":"要坚持取其精华、去其糟粕"},{"k":"B","v":"要摒弃传统文化，追求创新"},{"k":"C","v":"要推动中华优秀传统文化创造性转化和创新性发展"},{"k":"D","v":"要积极认同本民族文化，同时尊重文化多样性"}],"answer":"ACD","explanation":"不可丢弃中华优秀传统文化，故B不选。"},{"id":"m46","type":"multi","num":46,"tag":"青年工作","stem":"青年是推进中国式现代化主体力量的重要组成部分。近年来，习近平总书记围绕新时代青年工作发表一系列重要论述，下列有关青年工作的论述正确的有（ ）。","material":[],"options":[{"k":"A","v":"国之交在于民相亲，民相亲要从青年做起"},{"k":"B","v":"把党的中心任务作为中国青年运动和青年工作的主题和方向"},{"k":"C","v":"全党要把青年工作作为战略性工作来抓，用党的科学理论武装青年"},{"k":"D","v":"青年一代的理想信念、精神状态、综合素质，是一个国家核心竞争力的重要因素"}],"answer":"ABCD","explanation":"青年是推进中国式现代化主体力量的重要组成部分。近年来，习近平总书记围绕新时代青年工作发表一系列重要论述：国之交在于民相亲，民相亲要从青年做起；把党的中心任务作为中国青年运动和青年工作的主题和方向；全党要把青年工作作为战略性工作来抓，用党的科学理论武装青年；青年一代的理想信念、精神状态、综合素质，是一个国家核心竞争力的重要因素。"},{"id":"j1","type":"short","num":1,"tag":"党的二十大精神","stem":"习近平总书记在党的二十大报告中指出：十年来，我们经历了对党和人民事业具有重大现实意义和深远历史意义的三件大事。三件大事主要指？","material":[],"options":[],"answer":"一是迎来中国共产党成立一百周年；二是中国特色社会主义进入新时代；三是完成脱贫攻坚、全面建成小康社会的历史任务，实现第一个百年奋斗目标。","explanation":""},{"id":"j2","type":"short","num":2,"tag":"青年工作","stem":"习近平总书记在党的二十大报告中对广大青年提出了怎样的期望？","material":[],"options":[],"answer":"广大青年要坚定不移听党话、跟党走，怀抱梦想又脚踏实地，敢想敢为又善作善成，立志做有理想、敢担当、能吃苦、肯奋斗的新时代好青年，让青春在全面建设社会主义现代化国家的火热实践中绽放绚丽之花。","explanation":""},{"id":"j3","type":"short","num":3,"tag":"党的二十大精神","stem":"党的二十大中提出：前进道路上，必须牢牢把握哪五项重大原则？","material":[],"options":[],"answer":"坚持和加强党的全面领导、坚持中国特色社会主义道路、坚持以人民为中心的发展思想、坚持深化改革开放、坚持发扬斗争精神。","explanation":""},{"id":"j4","type":"short","num":4,"tag":"团史团务","stem":"入团誓词。","material":[],"options":[],"answer":"我志愿加入中国共产主义青年团，坚决拥护中国共产党的领导，遵守团的章程，执行团的决议，履行团员义务，严守团的纪律，勤奋学习，积极工作，吃苦在前，享受在后，为共产主义事业而奋斗。","explanation":""},{"id":"j5","type":"short","num":5,"tag":"习近平新时代中国特色社会主义思想","stem":"党的二十大报告系统概括了中国式现代化的五大特征，彰显了马克思主义的科学内涵和理论品质、中华文化的独特气质和精神内蕴，激荡并焕发着中华民族现代文明的蓬勃生命力。中国式现代化的五大特征是什么。","material":[],"options":[],"answer":"人口规模巨大的现代化，全体人民共同富裕的现代化，人与自然和谐共生的现代化，物质文明和精神文明相协调的现代化，走和平发展道路的现代化。","explanation":""},{"id":"j6","type":"short","num":6,"tag":"党章党规党纪","stem":"简述“四个意识”和“两个维护”的具体内容。","material":[],"options":[],"answer":"“四个意识”是指政治意识、大局意识、核心意识、看齐意识。“两个维护”是指坚决维护习近平总书记党中央的核心、全党的核心地位，坚决维护党中央权威和集中统一领导。","explanation":""},{"id":"j7","type":"short","num":7,"tag":"习近平新时代中国特色社会主义思想","stem":"学习贯彻习近平新时代中国特色社会主义思想是新时代新征程开创事业发展新局面的根本要求。党的二十大报告提出的“六个必须坚持”是继续推进理论创新的科学方法，也是习近平新时代中国特色社会主义思想的立场观点方法的重要体现，蕴含中国共产党人理论创造、实践探索的智慧结晶和时代精华。“六个必须坚持”是什么。","material":[],"options":[],"answer":"必须坚持人民至上、必须坚持自信自立、必须坚持守正创新、必须坚持问题导向、必须坚持系统观念、必须坚持胸怀天下。","explanation":""},{"id":"j8","type":"short","num":8,"tag":"习近平新时代中国特色社会主义思想","stem":"“五个必由之路”最早是由习近平总书记在2022年3月5日参加十三届全国人大五次会议内蒙古代表团审议时提出来的。党的二十大报告向全党郑重重申了这一重大论断，并将其提高到“在长期实践中得出的至关紧要的规律性认识”的高度，对于新时代新征程全面建设社会主义现代化国家、全面推进中华民族伟大复兴具有十分重要的理论意义和实践意义。请简述全党必须牢记的“五个必由之路”。","material":[],"options":[],"answer":"坚持党的全面领导是坚持和发展中国特色社会主义的必由之路；中国特色社会主义是实现中华民族伟大复兴的必由之路；团结奋斗是中国人民创造历史伟业的必由之路；贯彻新发展理念是新时代我国发展壮大的必由之路；全面从严治党是党永葆生机活力、走好新的赶考之路的必由之路。","explanation":""},{"id":"j9","type":"short","num":9,"tag":"习近平新时代中国特色社会主义思想","stem":"习近平新时代中国特色社会主义思想中指出，坚持和发展中国特色社会主义，总任务是什么？","material":[],"options":[],"answer":"总任务是实现社会主义现代化和中华民族伟大复兴，在全面建成小康社会的基础上，分两步走在本世纪中叶建成富强民主文明和谐美丽的社会主义现代化强国，以中国式现代化推进中华民族伟大复兴。","explanation":""},{"id":"j10","type":"short","num":10,"tag":"时政热点","stem":"2025年3月5日下午，习近平总书记在参加他所在的十四届全国人大三次会议江苏代表团审议时强调，圆满实现“十四五”发展目标，经济大省要挑大梁，主要表现在哪些方面？","material":[],"options":[],"answer":"江苏要把握好挑大梁的着力点，在推动科技创新和产业创新融合上打头阵，在推进深层次改革和高水平开放上勇争先，在落实国家重大发展战略上走在前，在促进全体人民共同富裕上作示范。","explanation":""},{"id":"j11","type":"short","num":11,"tag":"青年工作","stem":"习近平总书记在纪念五四运功100周年重要讲话中对新时代中国青年提出哪六点的期望？","material":[],"options":[],"answer":"新时代中国青年要树立远大理想、热爱伟大祖国、担当时代责任、用于砥砺奋斗、练就过硬本领、锤炼品德修为。","explanation":""},{"id":"j12","type":"short","num":12,"tag":"青年工作","stem":"2023年8月24日至26日，共青团中央书记处第一书记阿东到江苏调研，在东南大学参加“永远跟党走 再铸新辉煌”学习贯彻习近平总书记关于青年工作的重要思想主题活动，对青年发展提出了什么样的要求？","material":[],"options":[],"answer":"努力做到知史爱党、知史爱国，坚定信念之基、把牢青春成长的正确航向，明晰时代之责、肩负青春担当的重要使命，汲取奋进之力、彰显青春激昂的精神风貌，找到成才之路、积蓄青春建功的强劲动能，争做有理想、敢担当、能吃苦、肯奋斗的新时代好青年。","explanation":""}]}</script>

var App = {view:"home", params:{}};

/* ============================ 工具 ============================ */
function esc(s){
  return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];
  });
}
function fmtStem(s){
  return esc(s).replace(/[（(]\s*[)）]/g, '<span class="blank"></span>');
}
function pct(a,b){ return b ? Math.round(a/b*100) : 0; }
function shuffled(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){ var j = Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
function byType(t){ return QS.filter(function(q){ return q.type===t; }); }
function qids(list){ return list.map(function(q){ return q.id; }); }
function toast(msg){
  var t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(t._h); t._h = setTimeout(function(){ t.classList.remove("show"); }, 1700);
}
function isMastered(id){ return !!(S.prog[id] && S.prog[id].right); }
function wrongCount(){ return Object.keys(S.wrong).length; }
function favCount(){ return Object.keys(S.fav).length; }
function tagQuestions(tag){ return QS.filter(function(q){ return q.tag===tag; }); }
function masteryOf(list){
  var n = 0; list.forEach(function(q){ if(isMastered(q.id)) n++; }); return pct(n, list.length);
}
function overallAcc(){
  var seen = 0, right = 0;
  for(var id in S.stat){ seen += S.stat[id].seen; right += S.stat[id].right; }
  return {seen:seen, right:right, pct: pct(right, seen)};
}
function nowStr(){
  var d = new Date();
  var w = ["日","一","二","三","四","五","六"][d.getDay()];
  return (d.getMonth()+1) + "月" + d.getDate() + "日 周" + w;
}

/* ============================ 记录 ============================ */
function recordAnswer(q, ok, chosen, countWrong){
  var st = S.stat[q.id] || (S.stat[q.id] = {seen:0, right:0});
  st.seen++; if(ok) st.right++;
  var p = S.prog[q.id] || (S.prog[q.id] = {right:false, last:"", ts:0});
  if(ok) p.right = true;
  p.last = chosen || ""; p.ts = Date.now();
  if(!ok && countWrong !== false){
    S.wrong[q.id] = (S.wrong[q.id] || 0) + 1;
  }else if(ok && S.wrong[q.id]){
    S.wrong[q.id]--; if(S.wrong[q.id] <= 0) delete S.wrong[q.id];
  }
}

/* ============================ 会话 ============================ */
function startSession(ids, cfg){
  if(!ids.length){ toast("这里还没有题目"); return; }
  if(S.set.shuffle) ids = shuffled(ids);
  sess = {
    ids: ids, idx: 0, cfg: cfg, answers: {},
    start: Date.now(), done: false,
    limit: cfg.limit || 0
  };
  S.sess = sess; save();
  go("practice");
}
function saveSession(){
  if(sess && !sess.done) S.sess = sess; else if(sess && sess.done) S.sess = null;
  save();
}
function finishSession(){
  if(!sess) return;
  sess.done = true; sess.end = Date.now();
  S.sess = null; save();
  clearTimer();
  render();
}
function clearTimer(){ if(timerId){ clearInterval(timerId); timerId = null; } }

/* ============================ 路由 ============================ */
function go(view, params){
  App.view = view; App.params = params || {};
  if(view !== "practice"){ /* 保留 sess 供继续 */ }
  render();
  window.scrollTo(0,0);
}
function render(){
  clearTimer();
  document.body.dataset.view = App.view;
  var fn = {home:viewHome, tags:viewTags, lookup:viewLookup, me:viewMe, practice:viewPractice}[App.view] || viewHome;
  document.getElementById("view").innerHTML = fn();
  // tabbar
  var map = {home:"home", tags:"tags", lookup:"lookup", me:"me"};
  document.querySelectorAll(".tabbar button").forEach(function(b){
    b.classList.toggle("on", b.dataset.tab === map[App.view]);
  });
  document.querySelectorAll(".tabbar button .ic").forEach(function(el, i){
    var keys = ["home","tags","lookup","me"];
    el.innerHTML = SVG[keys[i]];
  });
  document.getElementById("themeBtn").textContent = S.set.theme === "dark" ? "☀" : "◐";
  afterRender();
}
function afterRender(){
  var search = document.getElementById("lk-search");
  if(search){
    search.addEventListener("input", function(e){
      lookupQ = e.target.value;
      refreshLookupList();
    });
  }
  if(App.view === "practice" && sess && !sess.done && sess.limit){
    startTimer();
  }
  if(pendingScroll){
    pendingScroll = false;
    var fb = document.querySelector(".fb");
    if(fb){
      var r = fb.getBoundingClientRect();
      if(r.bottom > window.innerHeight - 80){
        try{ fb.scrollIntoView({block:"nearest", behavior:"smooth"}); }catch(e){ fb.scrollIntoView(); }
      }
    }
  }
}

/* ============================ 速查页 ============================ */
function lookupRows(){
  var q = lookupQ.trim().toLowerCase();
  var list = QS.filter(function(x){
    if(lookupType !== "all" && x.type !== lookupType) return false;
    if(lookupOnly === "wrong" && !S.wrong[x.id]) return false;
    if(lookupOnly === "fav" && !S.fav[x.id]) return false;
    if(!q) return true;
    var hay = x.stem + " " + x.tag + " " + x.answer + " " + x.explanation + " " +
      x.options.map(function(o){ return o.v; }).join(" ") + x.material.join(" ");
    return hay.toLowerCase().indexOf(q) >= 0;
  });
  return list;
}
