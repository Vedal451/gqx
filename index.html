  h += '<p style="margin:0"><b>④ 错题重练</b>：答对的错题会自动从错题本中移除。</p>';
  h += '</div></section>';

  h += '<div style="text-align:center;color:var(--muted);font-size:11.5px;margin:24px 0 0;line-height:1.8">';
  h += '题库来源：附件1 · 第49期青共校学习资料<br>答案与解析均保留原文，仅供学习使用</div>';
  return h;
}

/* ============================ 练习 ============================ */
function currentQ(){ return sess ? Q[sess.ids[sess.idx]] : null; }
function sessState(id){
  var st = sess.answers[id];
  if(!st){ st = sess.answers[id] = {chosen:[], revealed:false, result:null, input:""}; }
  return st;
}
function correctOf(q, chosen){
  return chosen.slice().sort().join("") === q.answer.split("").sort().join("");
}
function viewPractice(){
  if(!sess) return '<div class="empty">还没有进行中的练习<br><br><button class="btn primary" data-act="nav:home">回到首页</button></div>';
  if(sess.done) return viewSummary();
  var q = currentQ();
  if(!q) return '<div class="empty">题目不存在</div>';
  var st = sessState(q.id);
  var n = sess.ids.length, i = sess.idx;
  var t = TYPES[q.type];
  var cfg = sess.cfg || {};
  var revealed = st.revealed;
  var isShort = q.type === "short";
  var h = '';

  h += '<div class="p-head"><div class="row">';
  h += '<button class="ibtn" data-act="quit" aria-label="退出练习">←</button>';
  h += '<div class="ttl"><b>'+esc(cfg.title || t.label)+'</b>'+(i+1)+' / '+n+'</div>';
  if(sess.limit) h += '<div class="clock" id="clock">--:--</div>';
  else h += '<div style="width:38px"></div>';
  h += '</div><div class="pbar"><i style="width:'+pct(i+ (revealed?1:0), n)+'%"></i></div></div>';

  h += '<div class="qcard">';
  h += '<div class="qmeta"><span class="pill">'+t.label+'</span><span class="pill ghost">'+esc(q.tag)+'</span>';
  if(revealed && st.result === true) h += '<span class="pill" style="background:var(--ok-soft);color:var(--ok)">已答对</span>';
  if(revealed && st.result === false) h += '<span class="pill" style="background:var(--bad-soft);color:var(--bad)">已答错</span>';
  h += '<span class="qnum">'+q.id.toUpperCase()+'</span></div>';

  h += '<div class="stem">'+fmtStem(q.stem)+'</div>';
  if(q.material.length){
    h += '<div class="material">';
    q.material.forEach(function(m){ h += '<div>'+esc(m)+'</div>'; });
    h += '</div>';
  }

  if(isShort){
    h += shortBody(q, st);
  }else{
    h += '<div class="opts">';
    q.options.forEach(function(o){
      var cls = "opt";
      var chosen = st.chosen.indexOf(o.k) >= 0;
      if(revealed){
        cls += " disabled";
        if(q.answer.indexOf(o.k) >= 0) cls += " correct";
        else if(chosen) cls += " wrong";
      }else if(chosen){
        cls += " sel";
      }
      h += '<button class="'+cls+'" data-act="opt:'+o.k+'">';
      h += '<span class="k">'+o.k+'</span><span class="v">'+esc(o.v)+'</span>';
      if(revealed && q.answer.indexOf(o.k) >= 0) h += '<span class="mark" style="color:var(--ok)">✓</span>';
      else if(revealed && chosen) h += '<span class="mark" style="color:var(--bad)">✕</span>';
      h += '</button>';
    });
    h += '</div>';
    if(revealed) h += feedbackHTML(q, st);
    else if(q.type === "multi") h += '<div class="small muted" style="margin-top:12px">多选题：选出所有正确项后点「提交答案」</div>';
  }

  h += '</div>'; // qcard

  // footer
  h += '<div class="p-foot"><div class="inner">';
  h += '<button class="btn fav '+(S.fav[q.id]?"on":"")+'" data-act="favq" aria-label="收藏">'+(S.fav[q.id]?"★":"☆")+'</button>';
  h += '<button class="btn" data-act="prev" '+(i===0?"disabled":"")+'>上一题</button>';
  if(revealed){
    h += '<button class="btn primary" data-act="next">'+(i===n-1?"完成 · 看成绩":"下一题 →")+'</button>';
  }else if(isShort){
    h += '<button class="btn primary" data-act="reveal">查看参考答案</button>';
  }else if(q.type === "multi" || !S.set.instant){
    h += '<button class="btn primary" data-act="submit" '+(st.chosen.length?"":"disabled")+'>提交答案</button>';
    if(q.type === "multi") h += '<button class="btn ghost" style="flex:0 0 auto" data-act="reveal">看答案</button>';
  }else{
    h += '<button class="btn primary" data-act="reveal">看答案</button>';
  }
  h += '</div></div>';
  return h;
}

function feedbackHTML(q, st){
  var ok = st.result === true;
  var cls = ok ? "ok" : "bad";
  var icon = ok ? "✓" : "✕";
  var title = ok ? "回答正确" : "回答错误";
  var h = '<div class="fb '+cls+'"><div class="fb-t"><span>'+icon+' '+title+'</span><span class="ans">正确答案 '+esc(q.answer)+'</span></div>';
  if(q.type === "short"){
    h += '<div class="fb-x">按参考答案自评掌握程度：</div>';
    h += '<div class="ans-block"><span class="lbl">参考答案</span><br>'+esc(q.answer)+'</div>';
  }else{
    var rightOpts = q.options.filter(function(o){ return q.answer.indexOf(o.k) >= 0; });
    h += '<div class="fb-x"><b>'+q.answer+'</b>　'+rightOpts.map(function(o){ return esc(o.v); }).join("　")+'</div>';
    if(q.explanation) h += '<div class="ans-block"><span class="lbl">解析</span><br>'+esc(q.explanation)+'</div>';
  }
  h += '</div>';
  return h;
}

function shortBody(q, st){
  var h = '';
  if(!st.revealed){
    h += '<textarea class="ta" id="short-input" placeholder="先自己默写要点，再比对参考答案（也可直接点「查看参考答案」）">'+esc(st.input||"")+'</textarea>';
    h += '<div class="self-grade"><button class="btn" data-act="short:compare">关键词比对</button></div>';
    return h;
  }
  h += '<div class="ans-block" style="margin-top:14px"><span class="lbl">参考答案</span><br>'+esc(q.answer)+'</div>';
  if(st.compare){
    var c = st.compare;
    h += '<div class="score-line"><span>要点命中 '+c.hit+'/'+c.total+'</span><div class="bar"><i style="width:'+c.pct+'%"></i></div><span>'+c.pct+'%</span></div>';
    if(c.missed.length){
      h += '<div class="kw"><span class="small muted" style="background:transparent;color:var(--muted);padding-left:0">未覆盖：</span>';
      c.missed.slice(0,10).forEach(function(m){ h += '<span class="miss">'+esc(m)+'</span>'; });
      h += '</div>';
    }
  }
  if(st.result === true || st.result === "half" || st.result === false){
    h += '<div class="chip brand" style="margin-top:10px">已自评：'+(st.result === true ? "已掌握" : st.result === "half" ? "有点模糊" : "没记住")+'</div><br>';
  }
  h += '<div class="self-grade">';
  h += '<button class="btn" data-act="mark:know">已掌握</button>';
  h += '<button class="btn" data-act="mark:fuzzy">有点模糊</button>';
  h += '<button class="btn" data-act="mark:no">没记住</button>';
  h += '</div>';
  return h;
}

/* 关键字命中比对（2-gram 覆盖率） */
function shortCompare(answer, input){
  var norm = function(s){ return String(s||"").replace(/[\s，,。；;：:、“”"'（）()【】\[\]·]/g,""); };
  var a = norm(answer), u = norm(input);
  var segs = String(answer).split(/[，,；;。、]/).map(function(s){ return s.trim(); }).filter(function(s){ return s.length >= 3; });
  var hit = 0, missed = [];
  segs.forEach(function(seg){
    var t = norm(seg);
    if(!t.length) return;
    var grams = [];
    for(var i=0;i<t.length-1;i++) grams.push(t.substr(i,2));
    var n = 0;
    grams.forEach(function(g){ if(u.indexOf(g) >= 0) n++; });
    if(grams.length && n / grams.length >= 0.6) hit++;
    else missed.push(seg.length > 16 ? seg.slice(0,16)+"…" : seg);
  });
  var total = segs.length || 1;
  return {hit: hit, total: total, missed: missed, pct: Math.round(hit/total*100)};
}

function viewSummary(){
  var total = sess.ids.length;
  var right = 0, half = 0, answered = 0;
  sess.ids.forEach(function(id){
    var st = sess.answers[id];
    if(st && st.revealed){
      answered++;
      if(st.result === true) right++;
      else if(st.result === "half") half++;
    }
  });
  var sec = Math.max(1, Math.round(((sess.end || Date.now()) - sess.start)/1000));
  var mm = Math.floor(sec/60), ss = sec%60;
  var score = Math.round((right + half*0.5) / total * 100);
  var cfg = sess.cfg || {};
  var h = '';
  h += '<div class="card summary" style="margin-top:14px">';
  h += '<div class="big">'+score+'<small>分</small></div>';
  h += '<h2>'+(score>=90?"很棒，可以上考场了":score>=70?"不错，再补几个盲点":"还有提升空间")+'</h2>';
  h += '<p>'+esc(cfg.title||"练习")+' · 用时 '+mm+'分'+ss+'秒</p>';
  h += '<div class="sum-grid"><div><b>'+answered+'</b><span>已作答</span></div><div><b>'+right+'</b><span>答对</span></div><div><b>'+Math.max(0, answered-right)+'</b><span>答错/未答</span></div></div>';
  h += '<div class="sum-actions"><button class="btn primary" data-act="again">再来一轮</button>';
  h += '<button class="btn" data-act="nav:lookup">逐题看解析</button>';
  h += '<button class="btn" data-act="nav:home">回到首页</button></div>';
  h += '</div>';

  // 本轮错题
  var wrongIds = sess.ids.filter(function(id){ var st = sess.answers[id]; return st && st.revealed && st.result === false; });
  if(wrongIds.length){
    h += '<section class="sec"><div class="sec-h"><h2>本轮错题</h2><span>'+wrongIds.length+' 题</span></div><div class="lk-list">';
    wrongIds.forEach(function(id){
      var q = Q[id];
      h += '<details class="qa"><summary><span class="no">'+q.id.toUpperCase()+'</span><span class="q">'+fmtStem(q.stem)+'</span><span class="a">'+esc(q.answer)+'</span></summary>';
      h += '<div class="body"><div class="opts2">';
      q.options.forEach(function(o){ h += '<div class="'+(q.answer.indexOf(o.k)>=0?"ok":"")+'"><b>'+o.k+'</b><span>'+esc(o.v)+'</span></div>'; });
      h += '</div><div class="exp">'+esc(q.explanation)+'</div></div></details>';
    });
    h += '</div></section>';
  }
  return h;
}

/* ============================ 计时 ============================ */
function startTimer(){
  var tick = function(){
    var el = document.getElementById("clock");
    if(!el || !sess || sess.done) return;
    var left = sess.limit - Math.floor((Date.now() - sess.start)/1000);
    if(left <= 0){
      el.textContent = "00:00";
      toast("时间到，自动交卷");
      finishSession();
      return;
    }
    var mm = Math.floor(left/60), ss = left%60;
    el.textContent = (mm<10?"0":"")+mm+":"+(ss<10?"0":"")+ss;
    el.classList.toggle("hot", left <= 60);
  };
  tick();
  timerId = setInterval(tick, 1000);
}

/* ============================ 交互 ============================ */
function answerObjective(q, st, chosen){
  pendingScroll = true;
  st.chosen = chosen;
  st.result = correctOf(q, chosen);
  st.revealed = true;
  recordAnswer(q, st.result, chosen.join(""));
  saveSession();
}
function clickOption(k){
  var q = currentQ(), st = sessState(q.id);
  if(st.revealed) return;
  if(q.type === "single"){
    st.chosen = [k];
    if(S.set.instant){ answerObjective(q, st, [k]); }
    else { saveSession(); }
  }else{
    var idx = st.chosen.indexOf(k);
    if(idx >= 0) st.chosen.splice(idx,1); else st.chosen.push(k);
    st.chosen.sort();
    saveSession();
  }
  render();
}
function submitAnswer(){
  var q = currentQ(), st = sessState(q.id);
  if(!st.chosen.length){ toast("请先选择答案"); return; }
  answerObjective(q, st, st.chosen.slice());
  render();
}
function revealAnswer(){
  pendingScroll = true;
  var q = currentQ(), st = sessState(q.id);
  if(!st.revealed){
    if(!st.chosen.length && q.type !== "short"){
      // 看答案 = 视为不会
      st.result = false;
      recordAnswer(q, false, "");
    }else if(q.type === "short"){
      st.result = null;
    }else{
      st.result = correctOf(q, st.chosen);
      recordAnswer(q, st.result, st.chosen.join(""));
    }
    st.revealed = true;
    saveSession();
  }
  render();
}
function markShort(mark){
  var q = currentQ(), st = sessState(q.id);
  if(mark === "know"){
    st.result = true;
    recordAnswer(q, true, "know");
  }else if(mark === "fuzzy"){
    st.result = "half";
    recordAnswer(q, false, "fuzzy", false);
  }else{
    st.result = false;
    recordAnswer(q, false, "no");
  }
  saveSession();
  toast(mark === "know" ? "标记为已掌握" : mark === "fuzzy" ? "已记录为模糊" : "已加入错题本");
  render();
}
function nextQ(){
  var q = currentQ(), st = sessState(q.id);
  // 未作答直接跳过：不计入正确率
  if(!st.revealed){
    st.revealed = true; st.result = null;
  }
  if(sess.idx >= sess.ids.length - 1){ finishSession(); return; }
  sess.idx++; saveSession(); render(); window.scrollTo(0,0);
}
function prevQ(){
  if(sess.idx > 0){ sess.idx--; saveSession(); render(); window.scrollTo(0,0); }
}
function toggleFav(id){
  if(S.fav[id]){ delete S.fav[id]; } else { S.fav[id] = 1; }
  save(); toast(S.fav[id] ? "已收藏" : "已取消收藏");
  render();
}

var ACTIONS = {
  "nav": function(p){ go(p); },
  "theme": function(){
    S.set.theme = S.set.theme === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", S.set.theme);
    save(); render();
  },
  "toggle": function(p){
    if(p === "onlyweak"){ tagOnlyWeak = !tagOnlyWeak; }
    else { S.set[p] = !S.set[p]; save(); }
    render();
  },
  "start": function(p){
    if(p === "all"){ startSession(qids(QS), {title:"全部题目 · 顺序"}); return; }
    if(p === "random"){ startSession(qids(shuffled(QS)).slice(0,20), {title:"随机 20 题"}); return; }
    if(p === "mock"){
      var pool = shuffled(qids(QS.filter(function(q){ return q.type !== "short"; }))).slice(0,20);
      startSession(pool, {title:"限时挑战", limit: 15*60});
      return;
    }
    if(p === "wrong"){
      var ids = Object.keys(S.wrong);
      if(!ids.length){ toast("错题本是空的，继续加油"); return; }
      startSession(ids, {title:"错题重练"});
      return;
    }
    if(p === "fav"){
      var fids = Object.keys(S.fav);
      if(!fids.length){ toast("还没有收藏题目"); return; }
      startSession(fids, {title:"收藏夹"});
      return;
    }
    if(TYPES[p]){ startSession(qids(byType(p)), {title:TYPES[p].label+"专项"}); }
  },
  "tag": function(tag){
    var list = tagQuestions(tag);
    if(tagOnlyWeak) list = list.filter(function(q){ return !isMastered(q.id); });
    if(!list.length){ toast("该考点已全部掌握 🎉"); return; }
    startSession(qids(list), {title:tag + (tagOnlyWeak?" · 未掌握":"")});
  },
  "one": function(id){ startSession([id], {title:"单题精练"}); },
  "fav": function(id){ toggleFav(id); },
  "favq": function(){ if(currentQ()) toggleFav(currentQ().id); },
  "opt": function(k){ clickOption(k); },
  "submit": function(){ submitAnswer(); },
  "reveal": function(){ revealAnswer(); },
  "next": function(){ nextQ(); },
  "prev": function(){ prevQ(); },
  "quit": function(){ saveSession(); go("home"); },
  "resume": function(){ if(sess){ go("practice"); } },
  "again": function(){
    var cfg = sess.cfg || {};
    var ids = sess.ids.slice();
    sess = null;
    startSession(ids, cfg);
  },
  "lookup:type": function(t){ lookupType = t; render(); },
  "lookup:clear": function(){ lookupQ = ""; render(); },
  "lookup:openall": function(){ lookupOpen = !lookupOpen; render(); },
  "lookup:only": function(v){ lookupOnly = (lookupOnly === v ? "all" : v); render(); },
  "key:toggle": function(){ keyOpen = !keyOpen; render(); },
  "short:compare": function(){
  pendingScroll = true;
    var q = currentQ(), st = sessState(q.id);
    var el = document.getElementById("short-input");
    st.input = el ? el.value : "";
    if(!st.input.trim()){ toast("先写点内容再比对"); return; }
    st.compare = shortCompare(q.answer, st.input);
    st.revealed = true;
    saveSession(); render();
  },
  "mark": function(m){ markShort(m); },
  "export": function(){
    var data = {app:"青共校刷题", exported:new Date().toISOString(), state:S};
    var blob = new Blob([JSON.stringify(data, null, 2)], {type:"application/json"});
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "青共校刷题-学习记录.json";
    document.body.appendChild(a); a.click(); a.remove();
    toast("已导出学习记录");
  },
  "import": function(){
    var inp = document.createElement("input");
    inp.type = "file"; inp.accept = ".json,application/json";
    inp.onchange = function(){
      var f = inp.files && inp.files[0];
      if(!f) return;
      var r = new FileReader();
      r.onload = function(){
        try{
          var d = JSON.parse(r.result);
          var st = d.state || d;
          if(!st || !st.prog) throw new Error("bad");
          var i, id;
          for(id in st.prog){ if(st.prog[id] && st.prog[id].right) S.prog[id] = st.prog[id]; }
          for(id in st.fav){ S.fav[id] = 1; }
          for(id in st.wrong){
            var w = st.wrong[id] || 0;
            if(w > (S.wrong[id] || 0)) S.wrong[id] = w;
          }
          for(id in st.stat){
            var a = st.stat[id], b = S.stat[id] || {seen:0, right:0};
            S.stat[id] = {seen: Math.max(a.seen, b.seen), right: Math.max(a.right, b.right)};
          }
          save(); render(); toast("学习记录已导入");
        }catch(e){ toast("文件格式不正确"); }
      };
      r.readAsText(f, "utf-8");
    };
    inp.click();
  },
  "reset": function(){
    if(confirm("确定清空全部学习进度吗？此操作不可恢复。")){
      S.prog = {}; S.wrong = {}; S.fav = {}; S.stat = {}; S.sess = null;
      sess = null; save(); render(); toast("已清空");
    }
  }
};

document.addEventListener("click", function(e){
  var el = e.target.closest("[data-act]");
  if(!el) return;
  var raw = el.dataset.act;
  var key = raw, param = "";
  if(!ACTIONS[key]){
    var best = "";
    for(var k in ACTIONS){
      if(raw.indexOf(k + ":") === 0 && k.length > best.length) best = k;
    }
    if(best){ key = best; param = raw.slice(best.length + 1); }
  }
  var fn = ACTIONS[key];
  if(fn){ e.preventDefault(); fn(param); }
});

document.addEventListener("input", function(e){
  if(e.target.id === "short-input" && sess && currentQ()){
    sessState(currentQ().id).input = e.target.value;
  }
});

document.addEventListener("keydown", function(e){
  if(App.view !== "practice" || !sess || sess.done) return;
  var tag = (e.target.tagName || "").toLowerCase();
  if(tag === "textarea" || tag === "input") return;
  var q = currentQ(); if(!q) return;
  var st = sessState(q.id);
  var k = e.key.toUpperCase();
  if(!st.revealed && q.type !== "short"){
    if(["A","B","C","D"].indexOf(k) >= 0){ e.preventDefault(); clickOption(k); return; }
    if(["1","2","3","4"].indexOf(k) >= 0){ e.preventDefault(); clickOption("ABCD"[+k-1]); return; }
  }
  if(e.key === "Enter"){
    e.preventDefault();
    if(st.revealed) nextQ();
    else if(q.type === "short") revealAnswer();
    else submitAnswer();
    return;
  }
  if(e.key === "ArrowRight"){ e.preventDefault(); nextQ(); return; }
  if(e.key === "ArrowLeft"){ e.preventDefault(); prevQ(); return; }
  if(k === "F"){ e.preventDefault(); toggleFav(q.id); }
});

/* ============================ 启动 ============================ */
document.documentElement.setAttribute("data-theme", S.set.theme || "light");
if(sess && sess.done) sess = null;
render();
})();
</script>
